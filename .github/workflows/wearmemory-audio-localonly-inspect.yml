name: Inspect WearMemory Audio v1.6.5 source

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: macos-15
    steps:
      - name: Checkout v1.6 source carrier
        uses: actions/checkout@v4
        with:
          ref: wearmemory-v1.6-playback-build
          path: carrier
          fetch-depth: 0

      - name: Checkout v1.6.5 patch carrier
        uses: actions/checkout@v4
        with:
          ref: wearmemory-v1.6.5-build
          path: v165
          fetch-depth: 0

      - name: Restore current v1.6.5 source
        shell: bash
        run: |
          set -euo pipefail
          cat carrier/wearmemory_v1.6_build/source.part1 \
              carrier/wearmemory_v1.6_build/source.part2 \
              carrier/wearmemory_v1.6_build/source.part3 \
              carrier/wearmemory_v1.6_build/source.part4 > /tmp/wm16-source.b64
          base64 -D -i /tmp/wm16-source.b64 -o /tmp/wm16-source.zip
          echo '910095e4ad4db56f21d2219483aa4b2faa7b97f20d0f2e7aedaea5f3f9a23029  /tmp/wm16-source.zip' | shasum -a 256 -c -
          rm -rf /tmp/wm165 && mkdir -p /tmp/wm165
          unzip -q /tmp/wm16-source.zip -d /tmp/wm165
          base64 -D -i v165/wearmemory_v1.6.5_build/wm165.patch.gz.b64 -o /tmp/wm165.patch.gz
          gunzip -c /tmp/wm165.patch.gz > /tmp/wm165.patch
          cd /tmp/wm165
          patch -p1 < /tmp/wm165.patch
          mkdir -p /tmp/source-inspect
          cp WearMemory/*.swift /tmp/source-inspect/
          cp WearMemory/Info.plist /tmp/source-inspect/
          cp project.yml /tmp/source-inspect/ || true
          find WearMemory -maxdepth 1 -name '*.entitlements' -exec cp {} /tmp/source-inspect/ \; || true
          grep -RniE 'drive|upload|queue|AudioInbox|m4a|application-groups|group.local' WearMemory project.yml > /tmp/source-inspect/search.txt || true

      - name: Upload source inspection
        uses: actions/upload-artifact@v4
        with:
          name: WearMemory-Audio-v1.6.5-SourceInspect
          path: /tmp/source-inspect/*
          retention-days: 1
