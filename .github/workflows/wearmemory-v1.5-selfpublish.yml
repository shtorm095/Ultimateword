name: Build and publish WearMemory v1.5 Browser Picker IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/wearmemory-v1.5-selfpublish.yml'
      - 'wearmemory_v1.5_trigger.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout exact WearMemory v1.5 source
        uses: actions/checkout@v4
        with:
          ref: wearmemory-v1.5-browser-build
          fetch-depth: 0

      - name: Build with diagnostics
        shell: bash
        run: |
          set +e
          rm -f /tmp/wm15-build.log /tmp/wm15-status.txt \
            /tmp/WearMemory_v1.5_BrowserPicker_iOS15.ipa \
            /tmp/WearMemory_v1.5_BrowserPicker_iOS15.ipa.sha256
          (
            set -euo pipefail

            cat wearmemory_v1.5_build/source.part1 \
                wearmemory_v1.5_build/source.part2 \
                wearmemory_v1.5_build/source.part3a \
                wearmemory_v1.5_build/source.part3b \
                wearmemory_v1.5_build/source.part3c \
                wearmemory_v1.5_build/source.part3d \
                wearmemory_v1.5_build/source.part4 \
                > /tmp/WearMemory_v1.5_Source.b64
            base64 -D -i /tmp/WearMemory_v1.5_Source.b64 -o /tmp/WearMemory_v1.5_Source.zip
            echo 'da2678e14332dc99a895b867c1769b3ac24cfde1c12535974ec372b7e11a59da  /tmp/WearMemory_v1.5_Source.zip' | shasum -a 256 -c -

            rm -rf /tmp/WearMemory_v1.5_Source
            mkdir -p /tmp/WearMemory_v1.5_Source
            unzip -q /tmp/WearMemory_v1.5_Source.zip -d /tmp/WearMemory_v1.5_Source
            cd /tmp/WearMemory_v1.5_Source

            test -f project.yml
            test -f WearMemory/Info.plist
            test -f WearMemory/GoogleDriveSync.swift
            test -f WearMemory/WearMemoryApp.swift

            plutil -lint WearMemory/Info.plist
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' WearMemory/Info.plist)" = "1.5"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' WearMemory/Info.plist)" = "15"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' WearMemory/Info.plist | \
              grep -Fx 'com.googleusercontent.apps.923188036776-mos9ub27f4k3bhnodr8r4n46flsisptj'

            grep -F 'UIApplication.shared.open(url, options: [:])' WearMemory/GoogleDriveSync.swift
            grep -F 'func handleOpenURL(_ url: URL)' WearMemory/GoogleDriveSync.swift
            grep -F '.onOpenURL { url in' WearMemory/WearMemoryApp.swift
            grep -F 'URLQueryItem(name: "trigger_onepick", value: "true")' WearMemory/GoogleDriveSync.swift
            grep -F 'URLQueryItem(name: "allow_multiple", value: "true")' WearMemory/GoogleDriveSync.swift
            grep -F 'URLQueryItem(name: "allow_folder_selection", value: "true")' WearMemory/GoogleDriveSync.swift
            grep -F 'URLQueryItem(name: "mimetypes", value: "application/vnd.google-apps.folder")' WearMemory/GoogleDriveSync.swift
            if grep -R -F 'ASWebAuthenticationSession(' WearMemory; then
              echo 'ERROR: legacy ASWebAuthenticationSession call is still present'
              exit 41
            fi

            brew install xcodegen
            xcodegen generate

            xcodebuild \
              -project WearMemory.xcodeproj \
              -scheme WearMemory \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build/DerivedData \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              TARGETED_DEVICE_FAMILY=1 \
              build

            APP="build/DerivedData/Build/Products/Release-iphoneos/WearMemory.app"
            test -d "$APP"
            /usr/bin/codesign --force --sign - "$APP" || true

            rm -rf Payload \
              WearMemory_v1.5_BrowserPicker_iOS15.ipa \
              WearMemory_v1.5_BrowserPicker_iOS15.ipa.sha256
            mkdir Payload
            cp -R "$APP" Payload/
            find Payload -name '.DS_Store' -type f -delete
            find Payload -name '__MACOSX' -type d -prune -exec rm -rf {} +
            zip -qry -9 WearMemory_v1.5_BrowserPicker_iOS15.ipa Payload \
              -x '*.DS_Store' '*/__MACOSX/*'
            unzip -t WearMemory_v1.5_BrowserPicker_iOS15.ipa
            shasum -a 256 WearMemory_v1.5_BrowserPicker_iOS15.ipa \
              > WearMemory_v1.5_BrowserPicker_iOS15.ipa.sha256

            cp WearMemory_v1.5_BrowserPicker_iOS15.ipa \
              /tmp/WearMemory_v1.5_BrowserPicker_iOS15.ipa
            cp WearMemory_v1.5_BrowserPicker_iOS15.ipa.sha256 \
              /tmp/WearMemory_v1.5_BrowserPicker_iOS15.ipa.sha256
          ) > /tmp/wm15-build.log 2>&1
          RC=$?
          echo "$RC" > /tmp/wm15-status.txt
          tail -n 160 /tmp/wm15-build.log || true
          exit 0

      - name: Publish diagnostics and IPA to result branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin wearmemory-v1.5-result
          git checkout -B wearmemory-v1.5-result origin/wearmemory-v1.5-result
          mkdir -p artifacts
          rm -f artifacts/WearMemory_v1.5_BrowserPicker_iOS15.ipa \
                artifacts/WearMemory_v1.5_BrowserPicker_iOS15.ipa.sha256
          cp /tmp/wm15-status.txt artifacts/build_status.txt
          cp /tmp/wm15-build.log artifacts/build.log
          if [ -f /tmp/WearMemory_v1.5_BrowserPicker_iOS15.ipa ]; then
            cp /tmp/WearMemory_v1.5_BrowserPicker_iOS15.ipa artifacts/
          fi
          if [ -f /tmp/WearMemory_v1.5_BrowserPicker_iOS15.ipa.sha256 ]; then
            cp /tmp/WearMemory_v1.5_BrowserPicker_iOS15.ipa.sha256 artifacts/
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts
          git commit -m 'WearMemory v1.5 Browser Picker build diagnostics' || true
          git push origin HEAD:wearmemory-v1.5-result
