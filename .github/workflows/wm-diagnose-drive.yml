name: Diagnose WearMemory Drive

on:
  pull_request:
    branches: [main]
    paths:
      - 'wm_drive_diag_trigger.txt'

jobs:
  diagnose:
    runs-on: macos-15
    steps:
      - name: Checkout source carrier
        uses: actions/checkout@v4
        with:
          ref: wearmemory-v1.6-playback-build
      - name: Reconstruct and inspect
        shell: bash
        run: |
          set -euo pipefail
          cat wearmemory_v1.6_build/source.part1 \
              wearmemory_v1.6_build/source.part2 \
              wearmemory_v1.6_build/source.part3 \
              wearmemory_v1.6_build/source.part4 > /tmp/src.b64
          base64 -D -i /tmp/src.b64 -o /tmp/src.zip
          rm -rf /tmp/wm && mkdir /tmp/wm && unzip -q /tmp/src.zip -d /tmp/wm
          python3 <<'PY'
          from pathlib import Path
          for fn in ['WearMemory/GoogleDriveSync.swift','WearMemory/AppModel.swift','WearMemory/AudioBufferManager.swift']:
              p=Path('/tmp/wm')/fn
              s=p.read_text()
              print('\n===== FILE', fn, '=====')
              lines=s.splitlines()
              needles=['enqueueAudio','flushQueueLocked','upload','setError','saveQueue','loadQueue','pendingCount','onSegmentCompleted','audioRecorderDidFinishRecording','statusText','lastError']
              hits=[]
              for i,l in enumerate(lines):
                  if any(n in l for n in needles): hits.append(i)
              ranges=[]
              for i in hits:
                  a=max(0,i-12); b=min(len(lines),i+35)
                  if ranges and a <= ranges[-1][1]+3: ranges[-1]=(ranges[-1][0],max(ranges[-1][1],b))
                  else: ranges.append((a,b))
              for a,b in ranges:
                  print(f'--- lines {a+1}-{b} ---')
                  for j in range(a,b): print(f'{j+1:04d}: {lines[j]}')
          PY
