name: Build WearMemory Text v1.1.2 Playback IPA

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source and install hybrid clean UI + audio playback
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wmtext112-src
          mkdir -p /tmp/wmtext112-src
          cat wearmemory_text_v100/source.part00 \
              wearmemory_text_v100/source.part01 \
              wearmemory_text_v100/source.part02 \
              wearmemory_text_v100/source.part03 \
              wearmemory_text_v100/source.part04 \
            | base64 --decode > /tmp/WearMemoryText_v1.0.0_Source.zip
          ditto -x -k /tmp/WearMemoryText_v1.0.0_Source.zip /tmp/wmtext112-src

          base64 -D -i wearmemory_text_v101/speech-fix.patch.gz.b64 -o /tmp/wmt101.patch.gz
          gunzip -c /tmp/wmt101.patch.gz > /tmp/wmt101.patch
          cd /tmp/wmtext112-src
          patch -p4 < /tmp/wmt101.patch
          sed -i '' 's/^    let drive = TextDriveSync()/    var drive = TextDriveSync()/' WearMemoryText/TextAppModel.swift

          base64 -D -i "$GITHUB_WORKSPACE/wearmemory_text_v105/speech-fix-v105.patch.gz.b64" -o /tmp/wmt105.patch.gz
          gunzip -c /tmp/wmt105.patch.gz > /tmp/wmtext105.patch
          patch -p0 < /tmp/wmtext105.patch

          cp "$GITHUB_WORKSPACE/wearmemory_text_v106/TextProcessor.swift" WearMemoryText/TextProcessor.swift
          cp "$GITHUB_WORKSPACE/wearmemory_text_v106/TextProcessorJournal.swift" WearMemoryText/TextProcessorJournal.swift
          python3 "$GITHUB_WORKSPACE/wearmemory_text_v106/adaptive60_patch.py"
          python3 "$GITHUB_WORKSPACE/wearmemory_text_v108/siri101_102_patch.py"
          python3 "$GITHUB_WORKSPACE/wearmemory_text_v110/hybrid_pc_patch.py"
          python3 "$GITHUB_WORKSPACE/wearmemory_text_v111/ui_patch.py"
          python3 "$GITHUB_WORKSPACE/wearmemory_text_v112/playback_patch.py"
          python3 "$GITHUB_WORKSPACE/wearmemory_text_v112/playback_compile_fix.py"
          python3 "$GITHUB_WORKSPACE/wearmemory_text_v112/retention24_patch.py"

          SRC=/tmp/wmtext112-src/WearMemoryText
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$SRC/Info.plist")" = '1.1.2'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$SRC/Info.plist")" = '12'
          grep -q 'AudioInboxPlayer' "$SRC/ContentView.swift"
          grep -q 'Label("Аудио"' "$SRC/ContentView.swift"
          grep -q 'AVAudioPlayer(contentsOf:' "$SRC/ContentView.swift"
          grep -q 'playPause' "$SRC/ContentView.swift"
          grep -q 'Slider(' "$SRC/ContentView.swift"
          grep -q 'retentionSeconds: TimeInterval = 24 \* 60 \* 60' "$SRC/ContentView.swift"
          grep -q 'purgeExpiredAudio' "$SRC/ContentView.swift"
          grep -q 'recordingEndedAt' "$SRC/ContentView.swift"
          grep -q 'maxFileProcessingSeconds: TimeInterval = 180' "$SRC/TextProcessor.swift"
          grep -q 'status: "needs_pc"' "$SRC/TextProcessor.swift"
          grep -q 'status: "recognized_complete"' "$SRC/TextProcessor.swift"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: /tmp/wmtext112-src
        run: xcodegen generate

      - name: Build arm64 iOS 15 app
        working-directory: /tmp/wmtext112-src
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project WearMemoryText.xcodeproj \
            -scheme WearMemoryText \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath /tmp/wmtext112-derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            clean build | tee /tmp/wmtext112-build.log

      - name: Sign and package TrollStore IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="/tmp/wmtext112-derived/Build/Products/Release-iphoneos/WearMemoryText.app"
          test -d "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = '1.1.2'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = '12'
          lipo -archs "$APP/WearMemoryText" | grep -w arm64
          codesign --force --sign - --entitlements /tmp/wmtext112-src/WearMemoryText/WearMemoryText.entitlements "$APP"
          codesign --verify --deep --strict "$APP"
          rm -rf /tmp/wmtext112-payload
          mkdir -p /tmp/wmtext112-payload/Payload
          ditto "$APP" /tmp/wmtext112-payload/Payload/WearMemoryText.app
          cd /tmp/wmtext112-payload
          zip -qry /tmp/WearMemoryText_v1.1.2b12_Playback_iOS15.ipa Payload
          shasum -a 256 /tmp/WearMemoryText_v1.1.2b12_Playback_iOS15.ipa > /tmp/WearMemoryText_v1.1.2b12_Playback_iOS15.ipa.sha256

      - name: Upload verified IPA
        uses: actions/upload-artifact@v4
        with:
          name: WearMemoryText-v1.1.2-Playback-Ready
          path: |
            /tmp/WearMemoryText_v1.1.2b12_Playback_iOS15.ipa
            /tmp/WearMemoryText_v1.1.2b12_Playback_iOS15.ipa.sha256
            /tmp/wmtext112-build.log
          retention-days: 7
