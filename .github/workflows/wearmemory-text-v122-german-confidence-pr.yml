name: WearMemory Text 1.2.2 DE Elektro Confidence

on:
  pull_request:
    branches: [ wearmemory-text-whisper-production ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build WearMemory Text 1.2.2
        shell: bash
        run: bash wearmemory_text_v121/build_production_v122.sh

      - name: Upload verified 1.2.2 IPA
        uses: actions/upload-artifact@v4
        with:
          name: WearMemoryText-v1.2.2-DEElektro-Confidence-CPU-NoBLAS-iOS15
          path: |
            /tmp/WearMemoryText_v1.2.2b22_DEElektro_Confidence_CPU_NoBLAS_iOS15.ipa
            /tmp/WearMemoryText_v1.2.2b22_DEElektro_Confidence_CPU_NoBLAS_iOS15.ipa.sha256
            /tmp/WearMemoryText_v1.2.2_Source.zip
            /tmp/wmtext121-entitlements.plist
            /tmp/wmtext121-build.log
          compression-level: 0
          retention-days: 7
