name: WearMemory Text 1.2.4 Base Small Dual Pass

on:
  pull_request:
    branches: [ wearmemory-text-v122-german-confidence-final ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build WearMemory Text 1.2.4
        shell: bash
        run: bash wearmemory_text_v121/build_production_v124.sh

      - name: Upload verified 1.2.4 IPA
        uses: actions/upload-artifact@v4
        with:
          name: WearMemoryText-v1.2.4-Base-SmallQ5_1-DualPass-DEElektro-iOS15
          path: |
            /tmp/WearMemoryText_v1.2.4b24_Base_SmallQ5_1_DualPass_DEElektro_iOS15.ipa
            /tmp/WearMemoryText_v1.2.4b24_Base_SmallQ5_1_DualPass_DEElektro_iOS15.ipa.sha256
            /tmp/WearMemoryText_v1.2.4_Source.zip
            /tmp/wmtext121-entitlements.plist
            /tmp/wmtext121-build.log
          compression-level: 0
          retention-days: 7
