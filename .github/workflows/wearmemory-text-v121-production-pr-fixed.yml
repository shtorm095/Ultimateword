name: WearMemory Text 1.2.1 Production PR Fixed

on:
  pull_request:
    branches: [ wearmemory-text-whisper-production ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build corrected production IPA
        shell: bash
        run: bash wearmemory_text_v121/build_production.sh

      - name: Upload verified production IPA
        uses: actions/upload-artifact@v4
        with:
          name: WearMemoryText-v1.2.1-WhisperBase-CPU-NoBLAS-iOS15-Fixed
          path: |
            /tmp/WearMemoryText_v1.2.1b21_WhisperBase_CPU_NoBLAS_iOS15.ipa
            /tmp/WearMemoryText_v1.2.1b21_WhisperBase_CPU_NoBLAS_iOS15.ipa.sha256
            /tmp/WearMemoryText_v1.2.1_Source.zip
            /tmp/wmtext121-entitlements.plist
            /tmp/wmtext121-build.log
          compression-level: 0
          retention-days: 7
