name: Export WearMemory Minimal Bridge IPAs

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified result branch
        uses: actions/checkout@v4
        with:
          ref: wearmemory-suite-minimal-bridge-result

      - name: Verify published IPAs
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/WearMemory_v1.6.5b24_MinimalVoiceBridge_iOS15.ipa
          test -f artifacts/WearMemoryVoice_v0.1_iOS15.ipa
          grep -F '1aebd494226aefbd650bec4990ba9fb3388f3e76b083aff9d28e16f133d10861' artifacts/WearMemory_v1.6.5b24_MinimalVoiceBridge_iOS15.ipa.sha256
          sha256sum artifacts/WearMemory_v1.6.5b24_MinimalVoiceBridge_iOS15.ipa | grep -F '1aebd494226aefbd650bec4990ba9fb3388f3e76b083aff9d28e16f133d10861'
          grep -F 'a4977dde1d32d8b1406a12eadfa74877d520a3cffe7c02e148e58a8f294f5b8e' artifacts/WearMemoryVoice_v0.1_iOS15.ipa.sha256
          sha256sum artifacts/WearMemoryVoice_v0.1_iOS15.ipa | grep -F 'a4977dde1d32d8b1406a12eadfa74877d520a3cffe7c02e148e58a8f294f5b8e'

      - name: Upload verified IPA bundle
        uses: actions/upload-artifact@v4
        with:
          name: WearMemory-MinimalBridge-Verified-IPAs
          path: |
            artifacts/WearMemory_v1.6.5b24_MinimalVoiceBridge_iOS15.ipa
            artifacts/WearMemory_v1.6.5b24_MinimalVoiceBridge_iOS15.ipa.sha256
            artifacts/WearMemoryVoice_v0.1_iOS15.ipa
            artifacts/WearMemoryVoice_v0.1_iOS15.ipa.sha256
            artifacts/wm-entitlements.plist
            artifacts/voice-entitlements.plist
          retention-days: 7
