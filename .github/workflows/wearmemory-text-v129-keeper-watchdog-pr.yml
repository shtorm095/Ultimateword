name: WearMemory Text 1.2.9 Keeper Active Watchdog

on:
  pull_request:
    branches: [ wearmemory-text-v126-no-file-deadline ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and verify WearMemory Text 1.2.9
        shell: bash
        run: bash wearmemory_text_v121/build_production_v129.sh

      - name: Upload verified Text 1.2.9
        uses: actions/upload-artifact@v4
        with:
          name: WearMemoryText-v1.2.9-Base-SmallQ5_1-TextKeeper-Active9MinuteWatchdog-DEElektro-iOS15
          path: |
            /tmp/WearMemoryText_v1.2.9b29_Base_SmallQ5_1_TextKeeper_Active9MinuteWatchdog_DEElektro_iOS15.ipa
            /tmp/WearMemoryText_v1.2.9b29_Base_SmallQ5_1_TextKeeper_Active9MinuteWatchdog_DEElektro_iOS15.ipa.sha256
            /tmp/WearMemoryText_v1.2.9_Source.zip
            /tmp/wm129-entitlements.plist
            /tmp/wmtext121-build.log
          compression-level: 0
          retention-days: 7
