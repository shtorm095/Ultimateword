name: Build WearMemory v1.1 IPA

on:
  push:
    branches:
      - wearmemory-v1.1-build
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        run: |
          set -euo pipefail
          cat wearmemory_build/source.part1 wearmemory_build/source.part2 wearmemory_build/source.part3 wearmemory_build/source.part4 > /tmp/WearMemorySource.b64
          base64 -D -i /tmp/WearMemorySource.b64 -o /tmp/WearMemorySource.zip
          mkdir -p /tmp/WearMemorySource
          unzip -q /tmp/WearMemorySource.zip -d /tmp/WearMemorySource
          test -f /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders/project.yml

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders
        run: xcodegen generate

      - name: Build device app
        working-directory: /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders
        run: |
          set -euo pipefail
          xcodebuild \
            -project WearMemory.xcodeproj \
            -scheme WearMemory \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA for TrollStore
        working-directory: /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/WearMemory.app"
          test -d "$APP"
          /usr/bin/codesign --force --sign - "$APP" || true
          rm -rf Payload WearMemory_v1.1_iOS15.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry WearMemory_v1.1_iOS15.ipa Payload
          shasum -a 256 WearMemory_v1.1_iOS15.ipa > WearMemory_v1.1_iOS15.ipa.sha256

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WearMemory-v1.1-iOS15
          path: |
            /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders/WearMemory_v1.1_iOS15.ipa
            /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders/WearMemory_v1.1_iOS15.ipa.sha256
          if-no-files-found: error
