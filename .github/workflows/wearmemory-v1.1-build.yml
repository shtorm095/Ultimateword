name: Build WearMemory v1.2 IPA

on:
  push:
    branches:
      - wearmemory-v1.2-ui
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        run: |
          set -euo pipefail
          cat wearmemory_build/source.part1 wearmemory_build/source.part2 wearmemory_build/source.part3 wearmemory_build/source.part4 > /tmp/WearMemorySource.b64
          base64 -D -i /tmp/WearMemorySource.b64 -o /tmp/WearMemorySource.zip
          mkdir -p /tmp/WearMemorySource
          unzip -q /tmp/WearMemorySource.zip -d /tmp/WearMemorySource
          test -f /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders/project.yml

      - name: Apply v1.2 dark UI
        run: |
          set -euo pipefail
          cat wearmemory_build/ui.part1 wearmemory_build/ui.part2 wearmemory_build/ui.part3 wearmemory_build/ui.part4 wearmemory_build/ui.part5 wearmemory_build/ui.part6 > /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders/WearMemory/ContentView.swift

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders
        run: xcodegen generate

      - name: Restore app Info.plist
        working-directory: /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders
        run: |
          set -euo pipefail
          P="WearMemory/Info.plist"
          PB=/usr/libexec/PlistBuddy
          $PB -c "Delete :CFBundleShortVersionString" "$P" 2>/dev/null || true
          $PB -c "Add :CFBundleShortVersionString string 1.2" "$P"
          $PB -c "Delete :CFBundleVersion" "$P" 2>/dev/null || true
          $PB -c "Add :CFBundleVersion string 12" "$P"
          $PB -c "Delete :NSMicrophoneUsageDescription" "$P" 2>/dev/null || true
          $PB -c "Add :NSMicrophoneUsageDescription string WearMemory записывает звук для 24-часового циклического аудиобуфера." "$P"
          $PB -c "Delete :NSSpeechRecognitionUsageDescription" "$P" 2>/dev/null || true
          $PB -c "Add :NSSpeechRecognitionUsageDescription string WearMemory преобразует речевые фрагменты в дневной текстовый журнал." "$P"
          $PB -c "Delete :NSCameraUsageDescription" "$P" 2>/dev/null || true
          $PB -c "Add :NSCameraUsageDescription string WearMemory использует камеру только когда вы сами выбираете фото или видео." "$P"
          $PB -c "Delete :UIBackgroundModes" "$P" 2>/dev/null || true
          $PB -c "Add :UIBackgroundModes array" "$P"
          $PB -c "Add :UIBackgroundModes:0 string audio" "$P"
          $PB -c "Delete :UIFileSharingEnabled" "$P" 2>/dev/null || true
          $PB -c "Add :UIFileSharingEnabled bool true" "$P"
          $PB -c "Delete :LSSupportsOpeningDocumentsInPlace" "$P" 2>/dev/null || true
          $PB -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$P"
          plutil -lint "$P"

      - name: Build device app
        working-directory: /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders
        run: |
          set -euo pipefail
          xcodebuild \
            -project WearMemory.xcodeproj \
            -scheme WearMemory \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            TARGETED_DEVICE_FAMILY=1 \
            build

      - name: Package IPA for TrollStore
        working-directory: /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/WearMemory.app"
          test -d "$APP"
          /usr/bin/codesign --force --sign - "$APP" || true
          rm -rf Payload WearMemory_v1.2_iOS15.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry WearMemory_v1.2_iOS15.ipa Payload
          shasum -a 256 WearMemory_v1.2_iOS15.ipa > WearMemory_v1.2_iOS15.ipa.sha256

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WearMemory-v1.2-iOS15
          path: |
            /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders/WearMemory_v1.2_iOS15.ipa
            /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders/WearMemory_v1.2_iOS15.ipa.sha256
          if-no-files-found: error
