name: Build WearMemory v1.3 IPA

on:
  push:
    branches:
      - wearmemory-v1.2-ui
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        run: |
          set -euo pipefail
          cat wearmemory_build/source.part1 wearmemory_build/source.part2 wearmemory_build/source.part3 wearmemory_build/source.part4 > /tmp/WearMemorySource.b64
          base64 -D -i /tmp/WearMemorySource.b64 -o /tmp/WearMemorySource.zip
          mkdir -p /tmp/WearMemorySource
          unzip -q /tmp/WearMemorySource.zip -d /tmp/WearMemorySource
          test -f /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders/project.yml

      - name: Apply v1.2 dark UI
        run: |
          set -euo pipefail
          cat wearmemory_build/ui.part1 wearmemory_build/ui.part2 wearmemory_build/ui.part3 wearmemory_build/ui.part4 wearmemory_build/ui.part5 wearmemory_build/ui.part6 > /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders/WearMemory/ContentView.swift

      - name: Apply v1.3 Google Drive settings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('/tmp/WearMemorySource/WearMemory_v1.1_AudioFolders/WearMemory')

          p = root / 'AppModel.swift'
          s = p.read_text()
          s = s.replace(
              '    @Published private(set) var batteryLevel: Float = -1\n',
              '    @Published private(set) var batteryLevel: Float = -1\n'
              '    @Published var googleDriveSyncEnabled: Bool = UserDefaults.standard.object(forKey: "googleDriveSyncEnabled") as? Bool ?? true {\n'
              '        didSet { UserDefaults.standard.set(googleDriveSyncEnabled, forKey: "googleDriveSyncEnabled") }\n'
              '    }\n'
          )
          s = s.replace(
              '        logs.onTextFileUpdated = { [weak self] url in\n            self?.externalTextFolder.syncTextFile(url)\n        }',
              '        logs.onTextFileUpdated = { [weak self] url in\n            guard let self, self.googleDriveSyncEnabled else { return }\n            self.externalTextFolder.syncTextFile(url)\n        }'
          )
          s = s.replace(
              '        audio.onSegmentCompleted = { [weak self] url, _, _ in\n            self?.externalAudioFolder.syncAudioFile(url)\n        }',
              '        audio.onSegmentCompleted = { [weak self] url, _, _ in\n            guard let self, self.googleDriveSyncEnabled else { return }\n            self.externalAudioFolder.syncAudioFile(url)\n        }'
          )
          p.write_text(s)

          p = root / 'ContentView.swift'
          s = p.read_text()
          old = '''                    sectionTitle("Папки")
                    storageCard
'''
          new = '''                    sectionTitle("Google Drive")
                    VStack(spacing: 0) {
                        HStack(spacing: 12) {
                            Image(systemName: "icloud.and.arrow.up.fill")
                                .font(.title2)
                                .foregroundColor(.blue)
                                .frame(width: 30)
                            VStack(alignment: .leading, spacing: 3) {
                                Text("Сохранять в Google Drive")
                                    .font(.headline)
                                    .foregroundColor(.white)
                                Text(model.googleDriveSyncEnabled ? "Автосохранение включено" : "Автосохранение выключено")
                                    .font(.caption)
                                    .foregroundColor(model.googleDriveSyncEnabled ? .green : .secondary)
                            }
                            Spacer()
                            Toggle("", isOn: $model.googleDriveSyncEnabled)
                                .labelsHidden()
                        }
                        .padding(14)

                        Divider().background(Color.white.opacity(0.08))

                        HStack {
                            Image(systemName: "doc.text.fill")
                                .foregroundColor(.purple)
                                .frame(width: 30)
                            VStack(alignment: .leading, spacing: 3) {
                                Text("Текст")
                                    .foregroundColor(.white)
                                Text(model.externalTextFolder.isConfigured ? "Audio Lesen · подключено" : "Audio Lesen · не выбрано")
                                    .font(.caption)
                                    .foregroundColor(model.externalTextFolder.isConfigured ? .green : .secondary)
                            }
                            Spacer()
                            Button("Выбрать") { showAudioLesenPicker = true }
                                .buttonStyle(.borderedProminent)
                        }
                        .padding(14)

                        Divider().background(Color.white.opacity(0.08))

                        HStack {
                            Image(systemName: "music.note")
                                .foregroundColor(.green)
                                .frame(width: 30)
                            VStack(alignment: .leading, spacing: 3) {
                                Text("Аудио")
                                    .foregroundColor(.white)
                                Text(model.externalAudioFolder.isConfigured ? "Audio Hören · подключено" : "Audio Hören · не выбрано")
                                    .font(.caption)
                                    .foregroundColor(model.externalAudioFolder.isConfigured ? .green : .secondary)
                            }
                            Spacer()
                            Button("Выбрать") { showAudioHoerenPicker = true }
                                .buttonStyle(.borderedProminent)
                        }
                        .padding(14)
                    }
                    .cardStyle()

                    sectionTitle("Папки")
                    storageCard
'''
          if old not in s:
              raise SystemExit('settings insertion point not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders
        run: xcodegen generate

      - name: Restore app Info.plist
        working-directory: /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders
        run: |
          set -euo pipefail
          P="WearMemory/Info.plist"
          PB=/usr/libexec/PlistBuddy
          $PB -c "Delete :CFBundleShortVersionString" "$P" 2>/dev/null || true
          $PB -c "Add :CFBundleShortVersionString string 1.3" "$P"
          $PB -c "Delete :CFBundleVersion" "$P" 2>/dev/null || true
          $PB -c "Add :CFBundleVersion string 13" "$P"
          $PB -c "Delete :NSMicrophoneUsageDescription" "$P" 2>/dev/null || true
          $PB -c "Add :NSMicrophoneUsageDescription string WearMemory записывает звук для 24-часового циклического аудиобуфера." "$P"
          $PB -c "Delete :NSSpeechRecognitionUsageDescription" "$P" 2>/dev/null || true
          $PB -c "Add :NSSpeechRecognitionUsageDescription string WearMemory преобразует речевые фрагменты в дневной текстовый журнал." "$P"
          $PB -c "Delete :NSCameraUsageDescription" "$P" 2>/dev/null || true
          $PB -c "Add :NSCameraUsageDescription string WearMemory использует камеру только когда вы сами выбираете фото или видео." "$P"
          $PB -c "Delete :UIBackgroundModes" "$P" 2>/dev/null || true
          $PB -c "Add :UIBackgroundModes array" "$P"
          $PB -c "Add :UIBackgroundModes:0 string audio" "$P"
          $PB -c "Delete :UIFileSharingEnabled" "$P" 2>/dev/null || true
          $PB -c "Add :UIFileSharingEnabled bool true" "$P"
          $PB -c "Delete :LSSupportsOpeningDocumentsInPlace" "$P" 2>/dev/null || true
          $PB -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$P"
          plutil -lint "$P"

      - name: Build device app
        working-directory: /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders
        run: |
          set -euo pipefail
          xcodebuild \
            -project WearMemory.xcodeproj \
            -scheme WearMemory \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            TARGETED_DEVICE_FAMILY=1 \
            build

      - name: Package IPA for TrollStore
        working-directory: /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/WearMemory.app"
          test -d "$APP"
          /usr/bin/codesign --force --sign - "$APP" || true
          rm -rf Payload WearMemory_v1.3_iOS15.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry WearMemory_v1.3_iOS15.ipa Payload
          shasum -a 256 WearMemory_v1.3_iOS15.ipa > WearMemory_v1.3_iOS15.ipa.sha256

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WearMemory-v1.3-iOS15
          path: |
            /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders/WearMemory_v1.3_iOS15.ipa
            /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders/WearMemory_v1.3_iOS15.ipa.sha256
          if-no-files-found: error
