name: Build WearMemory Text v1.1.9 All-Fixes IPA

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Text v1.1.9
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wmtext119-src /tmp/wmtext111-src /tmp/wmtext112-src /tmp/wmtext113-src /tmp/wmtext114-src /tmp/wmtext115-src /tmp/wmtext116-src /tmp/wmtext117-src /tmp/wmtext118-src
          mkdir -p /tmp/wmtext119-src
          cat wearmemory_text_v100/source.part00 \
              wearmemory_text_v100/source.part01 \
              wearmemory_text_v100/source.part02 \
              wearmemory_text_v100/source.part03 \
              wearmemory_text_v100/source.part04 \
            | base64 --decode > /tmp/WearMemoryText_v1.0.0_Source.zip
          unzip -t /tmp/WearMemoryText_v1.0.0_Source.zip
          ditto -x -k /tmp/WearMemoryText_v1.0.0_Source.zip /tmp/wmtext119-src

          base64 -D -i wearmemory_text_v101/speech-fix.patch.gz.b64 -o /tmp/wmt101.patch.gz
          echo 'b2077cfa763ab2f8e1b4d494ac61755921bdbc81d8c75f91ce1005591a10d6c5  /tmp/wmt101.patch.gz' | shasum -a 256 -c -
          gunzip -c /tmp/wmt101.patch.gz > /tmp/wmt101.patch
          cd /tmp/wmtext119-src
          patch -p4 < /tmp/wmt101.patch
          sed -i '' 's/^    let drive = TextDriveSync()/    var drive = TextDriveSync()/' WearMemoryText/TextAppModel.swift

          base64 -D -i "$GITHUB_WORKSPACE/wearmemory_text_v105/speech-fix-v105.patch.gz.b64" -o /tmp/wmt105.patch.gz
          gunzip -c /tmp/wmt105.patch.gz > /tmp/wmtext105.patch
          echo '863ad1a0d4fcade0faa474fb011a1e6a3a1cbe507754ddccc063f4a5775abc3b  /tmp/wmtext105.patch' | shasum -a 256 -c -
          patch -p0 < /tmp/wmtext105.patch

          cp "$GITHUB_WORKSPACE/wearmemory_text_v106/TextProcessor.swift" WearMemoryText/TextProcessor.swift
          cp "$GITHUB_WORKSPACE/wearmemory_text_v106/TextProcessorJournal.swift" WearMemoryText/TextProcessorJournal.swift
          python3 "$GITHUB_WORKSPACE/wearmemory_text_v106/adaptive60_patch.py"
          python3 "$GITHUB_WORKSPACE/wearmemory_text_v108/siri101_102_patch.py"
          python3 "$GITHUB_WORKSPACE/wearmemory_text_v110/hybrid_pc_patch.py"

          for v in 111 112 113 114 115 116 117 118; do ln -s /tmp/wmtext119-src "/tmp/wmtext${v}-src"; done
          python3 "$GITHUB_WORKSPACE/wearmemory_text_v111/ui_patch.py"
          python3 "$GITHUB_WORKSPACE/wearmemory_text_v112/playback_patch.py"
          python3 "$GITHUB_WORKSPACE/wearmemory_text_v112/playback_compile_fix.py"
          python3 "$GITHUB_WORKSPACE/wearmemory_text_v112/retention24_patch.py"
          python3 "$GITHUB_WORKSPACE/wearmemory_text_v113/final_text_patch.py"
          python3 "$GITHUB_WORKSPACE/wearmemory_text_v114/status_state_patch.py"
          python3 "$GITHUB_WORKSPACE/wearmemory_text_v115/tablet_status_patch.py"
          python3 "$GITHUB_WORKSPACE/wearmemory_text_v116/clear_stale_error_patch.py"
          python3 "$GITHUB_WORKSPACE/wearmemory_text_v117/clear_empty_queue_error_patch.py"
          python3 "$GITHUB_WORKSPACE/wearmemory_text_v118/embedded_m4a_metadata_patch.py"
          python3 "$GITHUB_WORKSPACE/wearmemory_text_v119/all_fixes_patch.py"

          SRC=/tmp/wmtext119-src/WearMemoryText
          plutil -lint "$SRC/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$SRC/Info.plist" | grep -Fx '1.1.9'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$SRC/Info.plist" | grep -Fx '19'

          # Speech: usable partial text must advance to the next piece, not become needs_pc.
          grep -q 'if !latestText.isEmpty' "$SRC/TextProcessor.swift"
          grep -q 'принимаю распознанный текст' "$SRC/TextProcessor.swift"
          grep -q 'принимаю partial после ошибки' "$SRC/TextProcessor.swift"
          grep -q 'Speech timeout без текста' "$SRC/TextProcessor.swift"
          grep -q 'if !text.isEmpty || warnings.isEmpty' "$SRC/TextProcessor.swift"
          ! grep -q 'reason: "Speech timeout на части' "$SRC/TextProcessor.swift"
          grep -q 'maxFileProcessingSeconds: TimeInterval = 180' "$SRC/TextProcessor.swift"

          # M4A metadata: choose newest old record, then rewrite from a clean composition.
          grep -q 'pcUpdatedAt.*tabletUpdatedAt.*ipadUpdatedAt' "$SRC/TextProcessor.swift"
          grep -q 'AVMutableComposition()' "$SRC/TextProcessor.swift"
          grep -q 'exporter.metadata = \[metadataItem\]' "$SRC/TextProcessor.swift"
          ! grep -q 'preserved = asset.metadata.filter' "$SRC/TextProcessor.swift"
          ! grep -q 'updateSpeechMetadata(for: url, status: "queued")' "$SRC/TextProcessor.swift"
          ! grep -q 'updateSpeechMetadata(for: sourceURL, status: "processing")' "$SRC/TextProcessor.swift"
          grep -q 'warnings.isEmpty ? nil : warnings.joined' "$SRC/TextProcessor.swift"
          grep -q 'if activeItemID == itemID { activeItemID = nil }' "$SRC/TextProcessor.swift"

          # Drive: one logical source name -> one stable pending id and exact-name preflight.
          grep -Fq 'id: "text:\(sourceURL.lastPathComponent)"' "$SRC/TextDriveSync.swift"
          grep -Fq 'id: "audio:\(audioURL.lastPathComponent)"' "$SRC/TextDriveSync.swift"
          ! grep -q 'id: "text:.*UUID().uuidString' "$SRC/TextDriveSync.swift"
          grep -q 'normalizedPendingQueue' "$SRC/TextDriveSync.swift"
          grep -q 'scheduleIdempotentUpload' "$SRC/TextDriveSync.swift"
          grep -q 'findRemoteFileID' "$SRC/TextDriveSync.swift"
          grep -Fq "name = '\(escaped)'" "$SRC/TextDriveSync.swift"
          ! grep -q 'Google Drive не вернул file id для TXT' "$SRC/TextDriveSync.swift"
          grep -q 'descriptor.operation == .createText,' "$SRC/TextDriveSync.swift"

          # Storage contract remains strict.
          grep -q 'func enqueueAudio(_ audioURL: URL)' "$SRC/TextDriveSync.swift"
          grep -q 'mimeType: "audio/mp4"' "$SRC/TextDriveSync.swift"
          ! grep -q 'enqueueAudioForPC' "$SRC/TextDriveSync.swift"
          ! grep -q 'application/json; charset=utf-8' "$SRC/TextDriveSync.swift"
          grep -q 'func writeSegmentText' "$SRC/TextProcessor.swift"
          grep -q 'appendingPathComponent(item.id + ".txt")' "$SRC/TextProcessor.swift"
          grep -q '24 \* 60 \* 60' "$SRC/TextAppModel.swift"
          grep -q 'Готов на iPad' "$SRC/ContentView.swift"
          grep -q 'Готов на Tablette' "$SRC/ContentView.swift"
          grep -q 'Готов на ПК' "$SRC/ContentView.swift"

          cd /tmp/wmtext119-src
          zip -qry /tmp/WearMemoryText_v1.1.9_Source.zip WearMemoryText project.yml
          unzip -t /tmp/WearMemoryText_v1.1.9_Source.zip

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: /tmp/wmtext119-src
        run: xcodegen generate

      - name: Build arm64 iOS 15 app
        working-directory: /tmp/wmtext119-src
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project WearMemoryText.xcodeproj \
            -scheme WearMemoryText \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath /tmp/wmtext119-derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            clean build | tee /tmp/wmtext119-build.log

      - name: Sign and package TrollStore IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="/tmp/wmtext119-derived/Build/Products/Release-iphoneos/WearMemoryText.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist" | grep -Fx 'WearMemory Text'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'local.pavel.WearMemoryText'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -Fx '1.1.9'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" | grep -Fx '19'
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist" | grep -Fx '15.0'
          lipo -archs "$APP/WearMemoryText" | grep -w arm64
          codesign --force --sign - --entitlements /tmp/wmtext119-src/WearMemoryText/WearMemoryText.entitlements "$APP"
          codesign --verify --deep --strict "$APP"
          codesign -d --entitlements :- "$APP" > /tmp/wmtext119-entitlements.plist 2>&1
          grep -q 'group.local.pavel.WearMemory' /tmp/wmtext119-entitlements.plist
          grep -q 'TROLLTROLL.\*' /tmp/wmtext119-entitlements.plist
          grep -q 'com.apple.token' /tmp/wmtext119-entitlements.plist
          rm -rf /tmp/wmtext119-payload
          mkdir -p /tmp/wmtext119-payload/Payload
          ditto "$APP" /tmp/wmtext119-payload/Payload/WearMemoryText.app
          cd /tmp/wmtext119-payload
          zip -qry /tmp/WearMemoryText_v1.1.9b19_AllFixes_iOS15.ipa Payload
          unzip -t /tmp/WearMemoryText_v1.1.9b19_AllFixes_iOS15.ipa
          shasum -a 256 /tmp/WearMemoryText_v1.1.9b19_AllFixes_iOS15.ipa > /tmp/WearMemoryText_v1.1.9b19_AllFixes_iOS15.ipa.sha256

      - name: Upload verified IPA
        uses: actions/upload-artifact@v4
        with:
          name: WearMemoryText-v1.1.9-AllFixes-Ready
          path: |
            /tmp/WearMemoryText_v1.1.9b19_AllFixes_iOS15.ipa
            /tmp/WearMemoryText_v1.1.9b19_AllFixes_iOS15.ipa.sha256
            /tmp/WearMemoryText_v1.1.9_Source.zip
            /tmp/wmtext119-entitlements.plist
            /tmp/wmtext119-build.log
          retention-days: 7
