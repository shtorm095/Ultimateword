name: Build WearMemory v1.4 OAuth IPA

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct v1.1 source
        run: |
          set -euo pipefail
          cat wearmemory_build/source.part1 wearmemory_build/source.part2 wearmemory_build/source.part3 wearmemory_build/source.part4 > /tmp/WearMemorySource.b64
          base64 -D -i /tmp/WearMemorySource.b64 -o /tmp/WearMemorySource.zip
          rm -rf /tmp/WearMemorySource
          mkdir -p /tmp/WearMemorySource
          unzip -q /tmp/WearMemorySource.zip -d /tmp/WearMemorySource
          test -f /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders/project.yml

      - name: Restore verified v1.4 OAuth source
        run: python3 wearmemory_build/apply_v1.4_final.py /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders/WearMemory

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders
        run: xcodegen generate

      - name: Restore v1.4 files after XcodeGen
        run: python3 wearmemory_build/apply_v1.4_final.py /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders/WearMemory

      - name: Validate app Info.plist
        working-directory: /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders
        run: |
          set -euo pipefail
          P="WearMemory/Info.plist"
          plutil -lint "$P"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$P")" = "1.4"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$P")" = "14"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$P" | grep -Fx 'com.googleusercontent.apps.923188036776-mos9ub27f4k3bhnodr8r4n46flsisptj'

      - name: Build device app
        working-directory: /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders
        run: |
          set -euo pipefail
          xcodebuild \
            -project WearMemory.xcodeproj \
            -scheme WearMemory \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            TARGETED_DEVICE_FAMILY=1 \
            build

      - name: Package IPA for TrollStore
        working-directory: /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/WearMemory.app"
          test -d "$APP"
          /usr/bin/codesign --force --sign - "$APP" || true
          rm -rf Payload WearMemory_v1.4_iOS15.ipa WearMemory_v1.4_iOS15.ipa.sha256
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry WearMemory_v1.4_iOS15.ipa Payload
          shasum -a 256 WearMemory_v1.4_iOS15.ipa > WearMemory_v1.4_iOS15.ipa.sha256
          unzip -t WearMemory_v1.4_iOS15.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WearMemory-v1.4-iOS15
          path: |
            /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders/WearMemory_v1.4_iOS15.ipa
            /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders/WearMemory_v1.4_iOS15.ipa.sha256
          if-no-files-found: error
