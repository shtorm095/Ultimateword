name: Build and publish WearMemory v1.4 IPA

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout build sources
        uses: actions/checkout@v4
        with:
          ref: wearmemory-v1.4-oauth-build2
          fetch-depth: 0

      - name: Reconstruct v1.1 source
        run: |
          set -euo pipefail
          cat wearmemory_build/source.part1 wearmemory_build/source.part2 wearmemory_build/source.part3 wearmemory_build/source.part4 > /tmp/WearMemorySource.b64
          base64 -D -i /tmp/WearMemorySource.b64 -o /tmp/WearMemorySource.zip
          rm -rf /tmp/WearMemorySource
          mkdir -p /tmp/WearMemorySource
          unzip -q /tmp/WearMemorySource.zip -d /tmp/WearMemorySource
          test -f /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders/project.yml

      - name: Restore verified v1.4 OAuth source
        run: python3 wearmemory_build/apply_v1.4_final.py /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders/WearMemory

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders
        run: xcodegen generate

      - name: Restore v1.4 files after XcodeGen
        run: python3 wearmemory_build/apply_v1.4_final.py /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders/WearMemory

      - name: Apply iOS 15 compatibility fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('/tmp/WearMemorySource/WearMemory_v1.1_AudioFolders/WearMemory')

          p = root / 'AppModel.swift'
          s = p.read_text()
          s = s.replace('    let driveSync = GoogleDriveSync()\n', '    var driveSync = GoogleDriveSync()\n')
          p.write_text(s)

          p = root / 'ContentView.swift'
          s = p.read_text()
          replacement = '''    private var recentAudioCard: some View {
          VStack(spacing: 0) {
              HStack {
                  Image(systemName: "waveform")
                      .foregroundColor(.blue)
                  VStack(alignment: .leading, spacing: 3) {
                      Text("Аудиобуфер")
                          .foregroundColor(.white)
                      Text("Фрагменты сохраняются автоматически")
                          .font(.caption)
                          .foregroundColor(.secondary)
                  }
                  Spacer()
                  Text("\\(model.audio.segmentCount)/480")
                      .font(.caption.monospacedDigit())
                      .foregroundColor(.blue)
              }
              .padding(14)
          }
          .cardStyle()
      }

      private var transcriptCard: some View {'''
          s2, count = re.subn(
              r'    private var recentAudioCard: some View \{.*?\n    private var transcriptCard: some View \{',
              replacement,
              s,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('recentAudioCard compatibility replacement failed')
          p.write_text(s2)
          PY

      - name: Validate app Info.plist
        working-directory: /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders
        run: |
          set -euo pipefail
          P="WearMemory/Info.plist"
          plutil -lint "$P"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$P")" = "1.4"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$P")" = "14"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$P" | grep -Fx 'com.googleusercontent.apps.923188036776-mos9ub27f4k3bhnodr8r4n46flsisptj'

      - name: Build device app
        working-directory: /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders
        run: |
          set -euo pipefail
          xcodebuild \
            -project WearMemory.xcodeproj \
            -scheme WearMemory \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            TARGETED_DEVICE_FAMILY=1 \
            build

      - name: Package IPA for TrollStore
        working-directory: /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/WearMemory.app"
          test -d "$APP"
          /usr/bin/codesign --force --sign - "$APP" || true
          rm -rf Payload WearMemory_v1.4_iOS15.ipa WearMemory_v1.4_iOS15.ipa.sha256
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry WearMemory_v1.4_iOS15.ipa Payload
          shasum -a 256 WearMemory_v1.4_iOS15.ipa > WearMemory_v1.4_iOS15.ipa.sha256
          unzip -t WearMemory_v1.4_iOS15.ipa

      - name: Publish IPA to result branch
        run: |
          set -euo pipefail
          cp /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders/WearMemory_v1.4_iOS15.ipa /tmp/WearMemory_v1.4_iOS15.ipa
          cp /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders/WearMemory_v1.4_iOS15.ipa.sha256 /tmp/WearMemory_v1.4_iOS15.ipa.sha256
          git fetch origin wearmemory-v1.4-result
          git checkout -B wearmemory-v1.4-result origin/wearmemory-v1.4-result
          mkdir -p artifacts
          cp /tmp/WearMemory_v1.4_iOS15.ipa artifacts/WearMemory_v1.4_iOS15.ipa
          cp /tmp/WearMemory_v1.4_iOS15.ipa.sha256 artifacts/WearMemory_v1.4_iOS15.ipa.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/WearMemory_v1.4_iOS15.ipa artifacts/WearMemory_v1.4_iOS15.ipa.sha256
          git commit -m "Publish WearMemory v1.4 IPA"
          git push origin HEAD:wearmemory-v1.4-result
