name: Build and publish WearMemory v1.4 IPA

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout build sources
        uses: actions/checkout@v4
        with:
          ref: wearmemory-v1.4-oauth-build2
          fetch-depth: 0

      - name: Build with diagnostics
        shell: bash
        run: |
          set +e
          rm -f /tmp/wm14-build.log /tmp/wm14-status.txt /tmp/WearMemory_v1.4_iOS15.ipa /tmp/WearMemory_v1.4_iOS15.ipa.sha256
          (
            set -euo pipefail
            cat wearmemory_build/source.part1 wearmemory_build/source.part2 wearmemory_build/source.part3 wearmemory_build/source.part4 > /tmp/WearMemorySource.b64
            base64 -D -i /tmp/WearMemorySource.b64 -o /tmp/WearMemorySource.zip
            rm -rf /tmp/WearMemorySource
            mkdir -p /tmp/WearMemorySource
            unzip -q /tmp/WearMemorySource.zip -d /tmp/WearMemorySource
            test -f /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders/project.yml
            python3 wearmemory_build/apply_v1.4_final.py /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders/WearMemory
            brew install xcodegen
            cd /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders
            xcodegen generate
            cd "$GITHUB_WORKSPACE"
            python3 wearmemory_build/apply_v1.4_final.py /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders/WearMemory
            python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('/tmp/WearMemorySource/WearMemory_v1.1_AudioFolders/WearMemory')
          p = root / 'AppModel.swift'
          s = p.read_text()
          s = s.replace('    let driveSync = GoogleDriveSync()\n', '    var driveSync = GoogleDriveSync()\n')
          p.write_text(s)
          p = root / 'ContentView.swift'
          s = p.read_text()
          replacement = '''    private var recentAudioCard: some View {
          VStack(spacing: 0) {
              HStack {
                  Image(systemName: "waveform")
                      .foregroundColor(.blue)
                  VStack(alignment: .leading, spacing: 3) {
                      Text("Аудиобуфер")
                          .foregroundColor(.white)
                      Text("Фрагменты сохраняются автоматически")
                          .font(.caption)
                          .foregroundColor(.secondary)
                  }
                  Spacer()
                  Text("\\(model.audio.segmentCount)/480")
                      .font(.caption.monospacedDigit())
                      .foregroundColor(.blue)
              }
              .padding(14)
          }
          .cardStyle()
      }

      private var transcriptCard: some View {'''
          s2, count = re.subn(r'    private var recentAudioCard: some View \{.*?\n    private var transcriptCard: some View \{', replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('recentAudioCard compatibility replacement failed')
          p.write_text(s2)
          PY
            cd /tmp/WearMemorySource/WearMemory_v1.1_AudioFolders
            P="WearMemory/Info.plist"
            plutil -lint "$P"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$P")" = "1.4"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$P")" = "14"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$P" | grep -Fx 'com.googleusercontent.apps.923188036776-mos9ub27f4k3bhnodr8r4n46flsisptj'
            xcodebuild -project WearMemory.xcodeproj -scheme WearMemory -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO TARGETED_DEVICE_FAMILY=1 build
            APP="build/DerivedData/Build/Products/Release-iphoneos/WearMemory.app"
            test -d "$APP"
            /usr/bin/codesign --force --sign - "$APP" || true
            rm -rf Payload WearMemory_v1.4_iOS15.ipa WearMemory_v1.4_iOS15.ipa.sha256
            mkdir Payload
            cp -R "$APP" Payload/
            zip -qry WearMemory_v1.4_iOS15.ipa Payload
            shasum -a 256 WearMemory_v1.4_iOS15.ipa > WearMemory_v1.4_iOS15.ipa.sha256
            unzip -t WearMemory_v1.4_iOS15.ipa
            cp WearMemory_v1.4_iOS15.ipa /tmp/WearMemory_v1.4_iOS15.ipa
            cp WearMemory_v1.4_iOS15.ipa.sha256 /tmp/WearMemory_v1.4_iOS15.ipa.sha256
          ) > /tmp/wm14-build.log 2>&1
          RC=$?
          echo "$RC" > /tmp/wm14-status.txt
          tail -n 120 /tmp/wm14-build.log || true
          exit 0

      - name: Publish diagnostics and IPA to result branch
        run: |
          set -euo pipefail
          git fetch origin wearmemory-v1.4-result
          git checkout -B wearmemory-v1.4-result origin/wearmemory-v1.4-result
          mkdir -p artifacts
          cp /tmp/wm14-status.txt artifacts/build_status.txt
          cp /tmp/wm14-build.log artifacts/build.log
          if [ -f /tmp/WearMemory_v1.4_iOS15.ipa ]; then cp /tmp/WearMemory_v1.4_iOS15.ipa artifacts/WearMemory_v1.4_iOS15.ipa; fi
          if [ -f /tmp/WearMemory_v1.4_iOS15.ipa.sha256 ]; then cp /tmp/WearMemory_v1.4_iOS15.ipa.sha256 artifacts/WearMemory_v1.4_iOS15.ipa.sha256; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts
          git commit -m "WearMemory v1.4 build diagnostics" || true
          git push origin HEAD:wearmemory-v1.4-result
