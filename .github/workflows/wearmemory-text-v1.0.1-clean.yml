name: Build WearMemory Text v1.0.1 Clean IPA

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and patch source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wmtext101-src
          mkdir -p /tmp/wmtext101-src
          cat wearmemory_text_v100/source.part00 \
              wearmemory_text_v100/source.part01 \
              wearmemory_text_v100/source.part02 \
              wearmemory_text_v100/source.part03 \
              wearmemory_text_v100/source.part04 \
            | base64 --decode > /tmp/WearMemoryText_v1.0.0_Source.zip
          unzip -t /tmp/WearMemoryText_v1.0.0_Source.zip
          ditto -x -k /tmp/WearMemoryText_v1.0.0_Source.zip /tmp/wmtext101-src
          base64 --decode wearmemory_text_v101/speech-fix.patch.gz.b64 > /tmp/wmt101.patch.gz
          echo 'b2077cfa763ab2f8e1b4d494ac61755921bdbc81d8c75f91ce1005591a10d6c5  /tmp/wmt101.patch.gz' | shasum -a 256 -c -
          gunzip -c /tmp/wmt101.patch.gz > /tmp/wmt101.patch
          cd /tmp/wmtext101-src
          patch -p4 < /tmp/wmt101.patch
          sed -i '' 's/^    let drive = TextDriveSync()/    var drive = TextDriveSync()/' WearMemoryText/TextAppModel.swift
          grep -q '^    var drive = TextDriveSync()' WearMemoryText/TextAppModel.swift
          grep -q 'min(60.0' WearMemoryText/TextProcessor.swift
          grep -q 'request.shouldReportPartialResults = true' WearMemoryText/TextProcessor.swift
          grep -q 'NSUnderlyingErrorKey' WearMemoryText/TextProcessor.swift
          grep -q 'attempt < 1' WearMemoryText/TextProcessor.swift
          grep -q 'case failed' WearMemoryText/Models.swift
          grep -q '<string>1.0.1</string>' WearMemoryText/Info.plist
          grep -q '<string>2</string>' WearMemoryText/Info.plist
          ! grep -R -q 'AVAudioRecorder' WearMemoryText
          ! grep -R -q 'Audio Hören' WearMemoryText
          zip -qry /tmp/WearMemoryText_v1.0.1_Source.zip WearMemoryText project.yml
          unzip -t /tmp/WearMemoryText_v1.0.1_Source.zip

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: /tmp/wmtext101-src
        run: xcodegen generate

      - name: Build arm64 iOS 15 app
        working-directory: /tmp/wmtext101-src
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project WearMemoryText.xcodeproj \
            -scheme WearMemoryText \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath /tmp/wmtext101-derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            clean build | tee /tmp/wmtext101-build.log

      - name: Package and sign for TrollStore
        shell: bash
        run: |
          set -euo pipefail
          APP=/tmp/wmtext101-derived/Build/Products/Release-iphoneos/WearMemoryText.app
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist" | grep -Fx 'WearMemory Text'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'local.pavel.WearMemoryText'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -Fx '1.0.1'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" | grep -Fx '2'
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist" | grep -Fx '15.0'
          lipo -archs "$APP/WearMemoryText" | grep -w arm64
          codesign --force --sign - --entitlements /tmp/wmtext101-src/WearMemoryText/WearMemoryText.entitlements "$APP"
          codesign --verify --deep --strict "$APP"
          codesign -d --entitlements :- "$APP" > /tmp/wmtext101-entitlements.plist 2>&1
          grep -q 'group.local.pavel.WearMemory' /tmp/wmtext101-entitlements.plist
          grep -q 'TROLLTROLL.\*' /tmp/wmtext101-entitlements.plist
          rm -rf /tmp/wmtext101-payload
          mkdir -p /tmp/wmtext101-payload/Payload
          ditto "$APP" /tmp/wmtext101-payload/Payload/WearMemoryText.app
          cd /tmp/wmtext101-payload
          zip -qry /tmp/WearMemoryText_v1.0.1b2_iOS15.ipa Payload
          unzip -t /tmp/WearMemoryText_v1.0.1b2_iOS15.ipa
          shasum -a 256 /tmp/WearMemoryText_v1.0.1b2_iOS15.ipa > /tmp/WearMemoryText_v1.0.1b2_iOS15.ipa.sha256

      - name: Upload verified IPA
        uses: actions/upload-artifact@v4
        with:
          name: WearMemoryText-v1.0.1-CleanInstall
          path: |
            /tmp/WearMemoryText_v1.0.1b2_iOS15.ipa
            /tmp/WearMemoryText_v1.0.1b2_iOS15.ipa.sha256
            /tmp/WearMemoryText_v1.0.1_Source.zip
            /tmp/wmtext101-entitlements.plist
            /tmp/wmtext101-build.log
          retention-days: 7
