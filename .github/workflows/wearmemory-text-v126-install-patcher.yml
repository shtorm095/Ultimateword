name: WearMemory Text 1.2.6 TrollStore Install Patch

on:
  workflow_dispatch:
  pull_request:
    branches: [ wearmemory-text-v125-background-processing ]
    paths:
      - 'wearmemory_text_patch126/**'
      - '.github/workflows/wearmemory-text-v126-install-patcher.yml'
  push:
    branches: [ wearmemory-text-v126-no-file-deadline ]
    paths:
      - 'wearmemory_text_patch126/**'
      - '.github/workflows/wearmemory-text-v126-install-patcher.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build small TrollStore patch IPA v2
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash wearmemory_text_patch126/build_patch_ipa.sh

      - name: Upload patch IPA v2
        uses: actions/upload-artifact@v4
        with:
          name: WearMemoryText-1.2.6-TrollStore-InstallPatch-v2-iOS15
          path: |
            /tmp/WearMemoryText_1.2.6_InstallPatch_v2_TrollStore_iOS15.ipa
            /tmp/WearMemoryText_1.2.6_InstallPatch_v2_TrollStore_iOS15.ipa.sha256
          compression-level: 0
          retention-days: 7
