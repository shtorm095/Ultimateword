name: Build WearMemory v1.6.3 Drive Retry IPA

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'wearmemory_v1.6.3_delivery_trigger.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout WearMemory v1.6 source carrier
        uses: actions/checkout@v4
        with:
          ref: wearmemory-v1.6-playback-build
          fetch-depth: 0

      - name: Reconstruct source and apply Drive reliability fixes
        shell: bash
        run: |
          set -euo pipefail
          cat wearmemory_v1.6_build/source.part1 \
              wearmemory_v1.6_build/source.part2 \
              wearmemory_v1.6_build/source.part3 \
              wearmemory_v1.6_build/source.part4 > /tmp/WearMemory_v1.6_Source.b64
          base64 -D -i /tmp/WearMemory_v1.6_Source.b64 -o /tmp/WearMemory_v1.6_Source.zip
          echo '910095e4ad4db56f21d2219483aa4b2faa7b97f20d0f2e7aedaea5f3f9a23029  /tmp/WearMemory_v1.6_Source.zip' | shasum -a 256 -c -

          rm -rf /tmp/WearMemory_v1.6.3_Source
          mkdir -p /tmp/WearMemory_v1.6.3_Source
          unzip -q /tmp/WearMemory_v1.6_Source.zip -d /tmp/WearMemory_v1.6.3_Source
          cd /tmp/WearMemory_v1.6.3_Source

          python3 <<'PY'
          from pathlib import Path

          def replace_func(text, signature, replacement):
              start = text.find(signature)
              assert start >= 0, f'function not found: {signature}'
              brace = text.find('{', start)
              assert brace >= 0
              depth = 0
              i = brace
              while i < len(text):
                  c = text[i]
                  if c == '{': depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          return text[:start] + replacement + text[end:]
                  i += 1
              raise AssertionError(f'unbalanced function: {signature}')

          # v1.6.1: propagate AudioBufferManager ObservableObject changes to SwiftUI.
          p = Path('WearMemory/AppModel.swift')
          s = p.read_text()
          if 'import Combine' not in s:
              s = s.replace('import UIKit\n', 'import UIKit\nimport Combine\n', 1)
          marker = '    private var batteryObserver: NSObjectProtocol?\n'
          assert marker in s
          if 'private var cancellables = Set<AnyCancellable>()' not in s:
              s = s.replace(marker, marker + '    private var cancellables = Set<AnyCancellable>()\n', 1)
          init_marker = '    init() {\n'
          subscription = '''    init() {\n        audio.objectWillChange\n            .receive(on: DispatchQueue.main)\n            .sink { [weak self] _ in self?.objectWillChange.send() }\n            .store(in: &cancellables)\n\n'''
          assert init_marker in s
          if 'audio.objectWillChange' not in s:
              s = s.replace(init_marker, subscription, 1)
          p.write_text(s)

          p = Path('WearMemory/GoogleDriveSync.swift')
          s = p.read_text()

          # Durable enqueue: finalized M4A is copied and queue is persisted before returning.
          s = replace_func(s, '    func enqueueAudio(_ sourceURL: URL)', '''    func enqueueAudio(_ sourceURL: URL) {
              guard syncEnabled else { return }

              workQueue.sync {
                  guard self.fm.fileExists(atPath: sourceURL.path) else {
                      self.setError("Очередь Google Drive: завершённый аудиофайл не найден")
                      return
                  }
                  let size = (try? sourceURL.resourceValues(forKeys: [.fileSizeKey]).fileSize) ?? 0
                  guard size > 0 else {
                      self.setError("Очередь Google Drive: завершённый аудиофайл пуст")
                      return
                  }

                  let target = self.pendingAudioDirectory.appendingPathComponent(sourceURL.lastPathComponent)
                  do {
                      if self.fm.fileExists(atPath: target.path) {
                          try self.fm.removeItem(at: target)
                      }
                      try self.fm.copyItem(at: sourceURL, to: target)
                  } catch {
                      self.setError("Очередь Google Drive: \\(error.localizedDescription)")
                      return
                  }

                  var queue = self.loadQueue()
                  let id = "audio:\\(target.lastPathComponent)"
                  queue.removeAll { $0.id == id }
                  queue.append(PendingItem(id: id, kind: .audio, path: target.path))
                  self.saveQueue(queue)
                  self.flushQueueLocked()
              }
          }''')

          # Rebuild queue entries from staged audio files if UserDefaults and disk ever diverge.
          insert_at = s.find('    private func flushQueueLocked()')
          assert insert_at >= 0
          helper = '''    private func reconcilePendingAudioFilesLocked() {
              guard let files = try? fm.contentsOfDirectory(
                  at: pendingAudioDirectory,
                  includingPropertiesForKeys: [.fileSizeKey],
                  options: [.skipsHiddenFiles]
              ) else { return }

              var queue = loadQueue()
              var changed = false
              for url in files where url.pathExtension.lowercased() == "m4a" {
                  let size = (try? url.resourceValues(forKeys: [.fileSizeKey]).fileSize) ?? 0
                  guard size > 0 else { continue }
                  let id = "audio:\\(url.lastPathComponent)"
                  if !queue.contains(where: { $0.id == id }) {
                      queue.append(PendingItem(id: id, kind: .audio, path: url.path))
                      changed = true
                  }
              }
              if changed { saveQueue(queue) }
          }

          private func publishHealthyStatus() {
              let count = loadQueue().count
              DispatchQueue.main.async {
                  self.pendingCount = count
                  self.lastError = nil
                  self.updatePublishedStatus()
              }
          }

          private func isRetryableNetworkError(_ error: Error) -> Bool {
              let ns = error as NSError
              guard ns.domain == NSURLErrorDomain else { return false }
              return [
                  NSURLErrorNetworkConnectionLost,
                  NSURLErrorNotConnectedToInternet,
                  NSURLErrorTimedOut,
                  NSURLErrorCannotConnectToHost,
                  NSURLErrorDNSLookupFailed,
                  NSURLErrorCannotFindHost
              ].contains(ns.code)
          }

          private func scheduleQueueRetry(after delay: TimeInterval = 5) {
              workQueue.asyncAfter(deadline: .now() + delay) { [weak self] in
                  guard let self = self, !self.isFlushing else { return }
                  self.flushQueueLocked()
              }
          }

'''
          s = s[:insert_at] + helper + s[insert_at:]

          s = replace_func(s, '    private func flushQueueLocked()', '''    private func flushQueueLocked() {
              guard syncEnabled, isAuthorized, foldersAuthorized, !isFlushing else { return }
              reconcilePendingAudioFilesLocked()
              let queue = loadQueue()
              guard !queue.isEmpty else {
                  updatePendingCount()
                  publishHealthyStatus()
                  return
              }
              isFlushing = true
              process(queue: queue, index: 0)
          }''')

          s = replace_func(s, '    private func process(queue: [PendingItem], index: Int)', '''    private func process(queue: [PendingItem], index: Int) {
              if index >= queue.count {
                  isFlushing = false
                  updatePendingCount()
                  publishHealthyStatus()
                  return
              }
              let item = queue[index]
              let url = URL(fileURLWithPath: item.path)
              guard fm.fileExists(atPath: url.path) else {
                  removePending(id: item.id)
                  process(queue: loadQueue(), index: 0)
                  return
              }

              withAccessToken { [weak self] tokenResult in
                  guard let self = self else { return }
                  switch tokenResult {
                  case .failure(let error):
                      self.workQueue.async {
                          self.isFlushing = false
                          self.setError("Google Drive: \\(error.localizedDescription)")
                          if self.isRetryableNetworkError(error) { self.scheduleQueueRetry() }
                      }
                  case .success(let token):
                      self.upload(item: item, url: url, accessToken: token) { result in
                          self.workQueue.async {
                              switch result {
                              case .failure(let error):
                                  self.isFlushing = false
                                  self.setError("Google Drive: \\(error.localizedDescription)")
                                  if self.isRetryableNetworkError(error) { self.scheduleQueueRetry() }
                              case .success:
                                  self.removePending(id: item.id)
                                  if item.kind == .audio { try? self.fm.removeItem(at: url) }
                                  self.publishHealthyStatus()
                                  self.process(queue: self.loadQueue(), index: 0)
                              }
                          }
                      }
                  }
              }
          }''')

          # Use uploadTask for request bodies; this is more reliable for binary M4A bodies on iOS 15.
          s = s.replace('        request.httpBody = body\n        URLSession.shared.dataTask(with: request) { data, response, error in',
                        '        URLSession.shared.uploadTask(with: request, from: body) { data, response, error in', 1)
          # Keep text media updates on uploadTask too.
          s = s.replace('        request.httpBody = data\n        URLSession.shared.dataTask(with: request) { data, response, error in',
                        '        URLSession.shared.uploadTask(with: request, from: data) { data, response, error in', 1)

          p.write_text(s)
          PY

          plutil -lint WearMemory/Info.plist
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 1.6.3' WearMemory/Info.plist
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 21' WearMemory/Info.plist

          grep -F 'audio.objectWillChange' WearMemory/AppModel.swift
          grep -F 'workQueue.sync' WearMemory/GoogleDriveSync.swift
          grep -F 'reconcilePendingAudioFilesLocked()' WearMemory/GoogleDriveSync.swift
          grep -F 'publishHealthyStatus()' WearMemory/GoogleDriveSync.swift
          grep -F 'isRetryableNetworkError' WearMemory/GoogleDriveSync.swift
          grep -F 'URLSession.shared.uploadTask(with: request, from: body)' WearMemory/GoogleDriveSync.swift
          grep -F 'URLSession.shared.uploadTask(with: request, from: data)' WearMemory/GoogleDriveSync.swift
          grep -F 'activeRecorder.stop()' WearMemory/AudioBufferManager.swift
          grep -F 'onSegmentCompleted?(url, start, end)' WearMemory/AudioBufferManager.swift

          python3 <<'PY'
          from pathlib import Path
          p = Path('project.yml')
          s = p.read_text()
          old = '    info:\n      path: WearMemory/Info.plist\n'
          marker = '        PRODUCT_NAME: WearMemory\n'
          assert old in s and marker in s
          s = s.replace(old, '')
          s = s.replace(marker, marker + '        INFOPLIST_FILE: WearMemory/Info.plist\n', 1)
          p.write_text(s)
          PY

      - name: Build arm64 iOS 15 app
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/WearMemory_v1.6.3_Source
          brew install xcodegen
          xcodegen generate
          xcodebuild \
            -project WearMemory.xcodeproj \
            -scheme WearMemory \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            TARGETED_DEVICE_FAMILY=1 \
            build | tee /tmp/wm163-build.log

          APP='build/DerivedData/Build/Products/Release-iphoneos/WearMemory.app'
          test -d "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = '1.6.3'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = '21'
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")" = '15.0'
          /usr/bin/file "$APP/WearMemory" | grep -F 'arm64'
          /usr/bin/codesign --force --sign - "$APP" || true

          rm -rf Payload WearMemory_v1.6.3_DriveRetry_iOS15.ipa WearMemory_v1.6.3_DriveRetry_iOS15.ipa.sha256
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry -9 WearMemory_v1.6.3_DriveRetry_iOS15.ipa Payload -x '*.DS_Store' '*/__MACOSX/*'
          unzip -t WearMemory_v1.6.3_DriveRetry_iOS15.ipa
          shasum -a 256 WearMemory_v1.6.3_DriveRetry_iOS15.ipa > WearMemory_v1.6.3_DriveRetry_iOS15.ipa.sha256
          cp WearMemory_v1.6.3_DriveRetry_iOS15.ipa /tmp/
          cp WearMemory_v1.6.3_DriveRetry_iOS15.ipa.sha256 /tmp/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WearMemory-v1.6.3-DriveRetry-iOS15
          path: |
            /tmp/WearMemory_v1.6.3_DriveRetry_iOS15.ipa
            /tmp/WearMemory_v1.6.3_DriveRetry_iOS15.ipa.sha256
          retention-days: 7

      - name: Publish IPA to result branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin wearmemory-v1.6.3-result
          git checkout -B wearmemory-v1.6.3-result origin/wearmemory-v1.6.3-result
          mkdir -p artifacts
          cp /tmp/WearMemory_v1.6.3_DriveRetry_iOS15.ipa artifacts/
          cp /tmp/WearMemory_v1.6.3_DriveRetry_iOS15.ipa.sha256 artifacts/
          cp /tmp/wm163-build.log artifacts/build.log
          echo 0 > artifacts/build_status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '4189823+github-actions[bot]@users.noreply.github.com'
          git add artifacts
          git commit -m 'WearMemory v1.6.3 Drive retry IPA' || true
          git push origin HEAD:wearmemory-v1.6.3-result
