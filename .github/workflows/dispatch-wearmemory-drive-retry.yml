name: Build WearMemory v1.6.4 Drive Fix IPA

on:
  push:
    branches: [main]
    paths:
      - 'wm_dispatch_drive_retry.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout build tools
        uses: actions/checkout@v4
        with:
          ref: main
          path: tools

      - name: Checkout verified source carrier
        uses: actions/checkout@v4
        with:
          ref: wearmemory-v1.6-playback-build
          path: source

      - name: Reconstruct and patch source
        shell: bash
        run: |
          set -euo pipefail
          cat source/wearmemory_v1.6_build/source.part1 \
              source/wearmemory_v1.6_build/source.part2 \
              source/wearmemory_v1.6_build/source.part3 \
              source/wearmemory_v1.6_build/source.part4 > /tmp/src.b64
          base64 -D -i /tmp/src.b64 -o /tmp/src.zip
          echo '910095e4ad4db56f21d2219483aa4b2faa7b97f20d0f2e7aedaea5f3f9a23029  /tmp/src.zip' | shasum -a 256 -c -
          rm -rf /tmp/wm164 && mkdir -p /tmp/wm164
          unzip -q /tmp/src.zip -d /tmp/wm164
          python3 tools/wm_build_v164.py /tmp/wm164
          plutil -lint /tmp/wm164/WearMemory/Info.plist
          grep -F 'scheduleQueueRetry' /tmp/wm164/WearMemory/GoogleDriveSync.swift
          grep -F 'URLSession.shared.uploadTask(with: request, from: body)' /tmp/wm164/WearMemory/GoogleDriveSync.swift

      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/wm164
          brew install xcodegen
          xcodegen generate
          xcodebuild \
            -project WearMemory.xcodeproj \
            -scheme WearMemory \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            TARGETED_DEVICE_FAMILY=1 \
            build | tee /tmp/wm164-build.log

          APP='build/DerivedData/Build/Products/Release-iphoneos/WearMemory.app'
          test -d "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = '1.6.4'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = '22'
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")" = '15.0'
          /usr/bin/file "$APP/WearMemory" | grep -F 'arm64'
          /usr/bin/codesign --force --sign - "$APP" || true

          rm -rf Payload WearMemory_v1.6.4_DriveFix_iOS15.ipa WearMemory_v1.6.4_DriveFix_iOS15.ipa.sha256
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry -9 WearMemory_v1.6.4_DriveFix_iOS15.ipa Payload -x '*.DS_Store' '*/__MACOSX/*'
          unzip -t WearMemory_v1.6.4_DriveFix_iOS15.ipa
          shasum -a 256 WearMemory_v1.6.4_DriveFix_iOS15.ipa > WearMemory_v1.6.4_DriveFix_iOS15.ipa.sha256
          cp WearMemory_v1.6.4_DriveFix_iOS15.ipa /tmp/
          cp WearMemory_v1.6.4_DriveFix_iOS15.ipa.sha256 /tmp/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WearMemory-v1.6.4-DriveFix-iOS15
          path: |
            /tmp/WearMemory_v1.6.4_DriveFix_iOS15.ipa
            /tmp/WearMemory_v1.6.4_DriveFix_iOS15.ipa.sha256
          retention-days: 7

      - name: Publish result
        if: always()
        shell: bash
        run: |
          set +e
          cd tools
          git fetch origin wearmemory-v1.6.4-result
          git checkout -B wearmemory-v1.6.4-result origin/wearmemory-v1.6.4-result
          mkdir -p artifacts
          if [ -f /tmp/WearMemory_v1.6.4_DriveFix_iOS15.ipa ]; then cp /tmp/WearMemory_v1.6.4_DriveFix_iOS15.ipa artifacts/; fi
          if [ -f /tmp/WearMemory_v1.6.4_DriveFix_iOS15.ipa.sha256 ]; then cp /tmp/WearMemory_v1.6.4_DriveFix_iOS15.ipa.sha256 artifacts/; fi
          if [ -f /tmp/wm164-build.log ]; then cp /tmp/wm164-build.log artifacts/build.log; fi
          date -u +%FT%TZ > artifacts/last_run.txt
          git config user.name 'github-actions[bot]'
          git config user.email '4189823+github-actions[bot]@users.noreply.github.com'
          git add artifacts
          git commit -m 'WearMemory v1.6.4 Drive fix build result' || true
          git push origin HEAD:wearmemory-v1.6.4-result
