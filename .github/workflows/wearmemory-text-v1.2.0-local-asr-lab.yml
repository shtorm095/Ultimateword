name: Build WearMemory Text v1.2.0 Local-ASR Lab IPA

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Text v1.2.0
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wmtext120-src /tmp/wmtext111-src /tmp/wmtext112-src /tmp/wmtext113-src /tmp/wmtext114-src /tmp/wmtext115-src /tmp/wmtext116-src /tmp/wmtext117-src /tmp/wmtext118-src /tmp/wmtext119-src
          mkdir -p /tmp/wmtext120-src
          cat wearmemory_text_v100/source.part00 \
              wearmemory_text_v100/source.part01 \
              wearmemory_text_v100/source.part02 \
              wearmemory_text_v100/source.part03 \
              wearmemory_text_v100/source.part04 \
            | base64 --decode > /tmp/WearMemoryText_v1.0.0_Source.zip
          unzip -t /tmp/WearMemoryText_v1.0.0_Source.zip
          ditto -x -k /tmp/WearMemoryText_v1.0.0_Source.zip /tmp/wmtext120-src

          base64 -D -i wearmemory_text_v101/speech-fix.patch.gz.b64 -o /tmp/wmt101.patch.gz
          echo 'b2077cfa763ab2f8e1b4d494ac61755921bdbc81d8c75f91ce1005591a10d6c5  /tmp/wmt101.patch.gz' | shasum -a 256 -c -
          gunzip -c /tmp/wmt101.patch.gz > /tmp/wmt101.patch
          cd /tmp/wmtext120-src
          patch -p4 < /tmp/wmt101.patch
          sed -i '' 's/^    let drive = TextDriveSync()/    var drive = TextDriveSync()/' WearMemoryText/TextAppModel.swift

          base64 -D -i "$GITHUB_WORKSPACE/wearmemory_text_v105/speech-fix-v105.patch.gz.b64" -o /tmp/wmt105.patch.gz
          gunzip -c /tmp/wmt105.patch.gz > /tmp/wmtext105.patch
          echo '863ad1a0d4fcade0faa474fb011a1e6a3a1cbe507754ddccc063f4a5775abc3b  /tmp/wmtext105.patch' | shasum -a 256 -c -
          patch -p0 < /tmp/wmtext105.patch

          cp "$GITHUB_WORKSPACE/wearmemory_text_v106/TextProcessor.swift" WearMemoryText/TextProcessor.swift
          cp "$GITHUB_WORKSPACE/wearmemory_text_v106/TextProcessorJournal.swift" WearMemoryText/TextProcessorJournal.swift
          python3 "$GITHUB_WORKSPACE/wearmemory_text_v106/adaptive60_patch.py"
          python3 "$GITHUB_WORKSPACE/wearmemory_text_v108/siri101_102_patch.py"
          python3 "$GITHUB_WORKSPACE/wearmemory_text_v110/hybrid_pc_patch.py"

          for v in 111 112 113 114 115 116 117 118 119; do ln -s /tmp/wmtext120-src "/tmp/wmtext${v}-src"; done
          python3 "$GITHUB_WORKSPACE/wearmemory_text_v111/ui_patch.py"
          python3 "$GITHUB_WORKSPACE/wearmemory_text_v112/playback_patch.py"
          python3 "$GITHUB_WORKSPACE/wearmemory_text_v112/playback_compile_fix.py"
          python3 "$GITHUB_WORKSPACE/wearmemory_text_v112/retention24_patch.py"
          python3 "$GITHUB_WORKSPACE/wearmemory_text_v113/final_text_patch.py"
          python3 "$GITHUB_WORKSPACE/wearmemory_text_v114/status_state_patch.py"
          python3 "$GITHUB_WORKSPACE/wearmemory_text_v115/tablet_status_patch.py"
          python3 "$GITHUB_WORKSPACE/wearmemory_text_v116/clear_stale_error_patch.py"
          python3 "$GITHUB_WORKSPACE/wearmemory_text_v117/clear_empty_queue_error_patch.py"
          python3 "$GITHUB_WORKSPACE/wearmemory_text_v118/embedded_m4a_metadata_patch.py"
          python3 "$GITHUB_WORKSPACE/wearmemory_text_v119/all_fixes_patch.py"
          python3 "$GITHUB_WORKSPACE/wearmemory_text_v120/local_asr_lab_patch.py"

          SRC=/tmp/wmtext120-src/WearMemoryText
          plutil -lint "$SRC/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$SRC/Info.plist" | grep -Fx '1.2.0'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$SRC/Info.plist" | grep -Fx '20'
          grep -Fq 'import whisper' "$SRC/LocalASRLab.swift"
          grep -Fq 'import VoskC' "$SRC/LocalASRLab.swift"
          grep -Fq 'vosk-model-small-de-0.15' "$SRC/LocalASRLab.swift"
          grep -Fq 'ggml-base.bin' "$SRC/LocalASRLab.swift"
          grep -Fq 'params.language = de' "$SRC/LocalASRLab.swift"
          grep -Fq 'contextParams.use_gpu = false' "$SRC/LocalASRLab.swift"
          grep -Fq 'LocalASRLabView(lab: localASR)' "$SRC/ContentView.swift"
          grep -Fq -- '-lwhisper_all' /tmp/wmtext120-src/project.yml
          grep -Fq -- '-lvosk_arm64' /tmp/wmtext120-src/project.yml

      - name: Build local ASR native libraries
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wmtext120-native /tmp/whisper.cpp /tmp/vosk-ios-carrier
          mkdir -p /tmp/wmtext120-native/lib /tmp/wmtext120-native/modules/whisper /tmp/wmtext120-native/modules/VoskC

          # whisper.cpp v1.8.6, custom iOS 15 arm64 CPU build.
          git clone --depth 1 --branch v1.8.6 https://github.com/ggml-org/whisper.cpp.git /tmp/whisper.cpp
          cd /tmp/whisper.cpp
          cmake -B build-ios-device -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_XCODE_ATTRIBUTE_SUPPORTED_PLATFORMS=iphoneos \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_EXAMPLES=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_SERVER=OFF \
            -DWHISPER_COREML=OFF \
            -DGGML_METAL=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -S .
          cmake --build build-ios-device --config Release -- -quiet

          WREL=build-ios-device/src/Release-iphoneos
          GREL=build-ios-device/ggml/src/Release-iphoneos
          test -f "$WREL/libwhisper.a"
          test -f "$GREL/libggml.a"
          test -f "$GREL/libggml-base.a"
          test -f "$GREL/libggml-cpu.a"
          libtool -static -o /tmp/wmtext120-native/lib/libwhisper_all.a \
            "$WREL/libwhisper.a" \
            "$GREL/libggml.a" \
            "$GREL/libggml-base.a" \
            "$GREL/libggml-cpu.a"
          cp include/whisper.h ggml/include/*.h /tmp/wmtext120-native/modules/whisper/
          cat > /tmp/wmtext120-native/modules/whisper/module.modulemap <<'EOF'
          module whisper [system] {
            header "whisper.h"
            export *
          }
          EOF

          # Prebuilt Vosk iOS static library from the maintained iOS integration carrier.
          git clone --depth 1 https://github.com/gaudravi09/capacitor-offline-speech-recognition.git /tmp/vosk-ios-carrier
          cd /tmp/vosk-ios-carrier
          git checkout 703dd9d674d6f78788429ee6bd976dbecbc20a40
          test -f ios/libvosk.xcframework/ios-arm64_armv7_armv7s/libvosk.a
          lipo ios/libvosk.xcframework/ios-arm64_armv7_armv7s/libvosk.a -thin arm64 -output /tmp/wmtext120-native/lib/libvosk_arm64.a
          cp ios/Sources/OfflineSpeechRecognitionPlugin/vosk_api.h /tmp/wmtext120-native/modules/VoskC/
          cat > /tmp/wmtext120-native/modules/VoskC/module.modulemap <<'EOF'
          module VoskC [system] {
            header "vosk_api.h"
            export *
          }
          EOF

          lipo -archs /tmp/wmtext120-native/lib/libwhisper_all.a | grep -w arm64
          lipo -archs /tmp/wmtext120-native/lib/libvosk_arm64.a | grep -w arm64

      - name: Download German ASR models
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wmtext120-models
          mkdir -p /tmp/wmtext120-models

          curl -L --fail --retry 3 \
            -o /tmp/wmtext120-models/ggml-base.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin
          test "$(stat -f%z /tmp/wmtext120-models/ggml-base.bin)" -gt 100000000

          curl -L --fail --retry 3 \
            -o /tmp/wmtext120-models/vosk-de.zip \
            https://alphacephei.com/vosk/models/vosk-model-small-de-0.15.zip
          unzip -q /tmp/wmtext120-models/vosk-de.zip -d /tmp/wmtext120-models
          test -d /tmp/wmtext120-models/vosk-model-small-de-0.15/am
          rm /tmp/wmtext120-models/vosk-de.zip

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: /tmp/wmtext120-src
        run: xcodegen generate

      - name: Build arm64 iOS 15 app
        working-directory: /tmp/wmtext120-src
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project WearMemoryText.xcodeproj \
            -scheme WearMemoryText \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath /tmp/wmtext120-derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            clean build | tee /tmp/wmtext120-build.log

      - name: Bundle models, sign and package TrollStore IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="/tmp/wmtext120-derived/Build/Products/Release-iphoneos/WearMemoryText.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist" | grep -Fx 'WearMemory Text'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'local.pavel.WearMemoryText'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -Fx '1.2.0'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" | grep -Fx '20'
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist" | grep -Fx '15.0'
          lipo -archs "$APP/WearMemoryText" | grep -w arm64

          rm -rf "$APP/LocalASRModels"
          mkdir -p "$APP/LocalASRModels"
          cp /tmp/wmtext120-models/ggml-base.bin "$APP/LocalASRModels/"
          ditto /tmp/wmtext120-models/vosk-model-small-de-0.15 "$APP/LocalASRModels/vosk-model-small-de-0.15"
          test -f "$APP/LocalASRModels/ggml-base.bin"
          test -f "$APP/LocalASRModels/vosk-model-small-de-0.15/am/final.mdl"

          codesign --force --sign - --entitlements /tmp/wmtext120-src/WearMemoryText/WearMemoryText.entitlements "$APP"
          codesign --verify --deep --strict "$APP"
          codesign -d --entitlements :- "$APP" > /tmp/wmtext120-entitlements.plist 2>&1
          grep -q 'group.local.pavel.WearMemory' /tmp/wmtext120-entitlements.plist
          grep -q 'TROLLTROLL.\*' /tmp/wmtext120-entitlements.plist

          rm -rf /tmp/wmtext120-payload
          mkdir -p /tmp/wmtext120-payload/Payload
          ditto "$APP" /tmp/wmtext120-payload/Payload/WearMemoryText.app
          cd /tmp/wmtext120-payload
          zip -qry /tmp/WearMemoryText_v1.2.0b20_LocalASR_iOS15.ipa Payload
          unzip -t /tmp/WearMemoryText_v1.2.0b20_LocalASR_iOS15.ipa
          shasum -a 256 /tmp/WearMemoryText_v1.2.0b20_LocalASR_iOS15.ipa > /tmp/WearMemoryText_v1.2.0b20_LocalASR_iOS15.ipa.sha256

          cd /tmp/wmtext120-src
          zip -qry /tmp/WearMemoryText_v1.2.0_Source.zip WearMemoryText project.yml
          unzip -t /tmp/WearMemoryText_v1.2.0_Source.zip

      - name: Upload verified IPA
        uses: actions/upload-artifact@v4
        with:
          name: WearMemoryText-v1.2.0-LocalASR-Ready
          path: |
            /tmp/WearMemoryText_v1.2.0b20_LocalASR_iOS15.ipa
            /tmp/WearMemoryText_v1.2.0b20_LocalASR_iOS15.ipa.sha256
            /tmp/WearMemoryText_v1.2.0_Source.zip
            /tmp/wmtext120-entitlements.plist
            /tmp/wmtext120-build.log
          retention-days: 7
