name: Build and publish WearMemory v1.6 Playback IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/wearmemory-v1.6-playback-selfpublish.yml'
      - 'wearmemory_v1.6_trigger.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout WearMemory v1.5 source carrier
        uses: actions/checkout@v4
        with:
          ref: wearmemory-v1.5-browser-build
          fetch-depth: 0

      - name: Reconstruct v1.5 source and apply v1.6 playback fixes
        shell: bash
        run: |
          set -euo pipefail
          cat wearmemory_v1.5_build/source.part1 \
              wearmemory_v1.5_build/source.part2 \
              wearmemory_v1.5_build/source.part3a \
              wearmemory_v1.5_build/source.part3b \
              wearmemory_v1.5_build/source.part3c \
              wearmemory_v1.5_build/source.part3d \
              wearmemory_v1.5_build/source.part4 \
              > /tmp/WearMemory_v1.5_Source.b64
          base64 -D -i /tmp/WearMemory_v1.5_Source.b64 -o /tmp/WearMemory_v1.5_Source.zip
          echo 'da2678e14332dc99a895b867c1769b3ac24cfde1c12535974ec372b7e11a59da  /tmp/WearMemory_v1.5_Source.zip' | shasum -a 256 -c -

          rm -rf /tmp/WearMemory_v1.6_Source
          mkdir -p /tmp/WearMemory_v1.6_Source
          unzip -q /tmp/WearMemory_v1.5_Source.zip -d /tmp/WearMemory_v1.6_Source
          cd /tmp/WearMemory_v1.6_Source

          python3 <<'PY'
          from pathlib import Path
          root = Path('.')

          p = root / 'WearMemory/AudioBufferManager.swift'
          s = p.read_text()
          s = s.replace(
              'final class AudioBufferManager: NSObject, ObservableObject, AVAudioRecorderDelegate {',
              'final class AudioBufferManager: NSObject, ObservableObject, AVAudioRecorderDelegate, AVAudioPlayerDelegate {'
          )
          s = s.replace(
              '    @Published private(set) var recentSegments: [AudioSegmentSummary] = []\n',
              '    @Published private(set) var recentSegments: [AudioSegmentSummary] = []\n    @Published private(set) var playingURL: URL?\n'
          )
          s = s.replace(
              '    private var recorder: AVAudioRecorder?\n',
              '    private var recorder: AVAudioRecorder?\n    private var player: AVAudioPlayer?\n'
          )
          s = s.replace('    func start() {\n        requestMicPermission', '    func start() {\n        stopPlayback()\n        requestMicPermission')

          old = '''    func stop() {
              shouldContinue = false
              recorder?.stop()
              recorder = nil
              isRecording = false
              statusText = "Остановлено"
              try? AVAudioSession.sharedInstance().setActive(false, options: [.notifyOthersOnDeactivation])
          }
          '''
          new = '''    func stop() {
              shouldContinue = false
              guard let activeRecorder = recorder else {
                  isRecording = false
                  statusText = "Остановлено"
                  if player == nil {
                      try? AVAudioSession.sharedInstance().setActive(false, options: [.notifyOthersOnDeactivation])
                  }
                  return
              }

              // Keep AVAudioRecorder alive until its delegate confirms finalization.
              // That callback queues the completed M4A for Drive and transcription.
              activeRecorder.stop()
              isRecording = false
              statusText = "Остановлено"
          }

          func togglePlayback(_ url: URL) {
              let normalized = url.standardizedFileURL
              if let playingURL = playingURL?.standardizedFileURL,
                 playingURL == normalized,
                 player?.isPlaying == true {
                  stopPlayback()
                  return
              }

              stopPlayback()

              do {
                  let session = AVAudioSession.sharedInstance()
                  if !isRecording {
                      try session.setCategory(.playback, mode: .default, options: [])
                      try session.setActive(true, options: [])
                  }

                  let newPlayer = try AVAudioPlayer(contentsOf: normalized)
                  newPlayer.delegate = self
                  newPlayer.prepareToPlay()
                  guard newPlayer.play() else {
                      throw NSError(domain: "WearMemory", code: 2, userInfo: [NSLocalizedDescriptionKey: "Не удалось начать воспроизведение"])
                  }
                  player = newPlayer
                  playingURL = normalized
              } catch {
                  player = nil
                  playingURL = nil
                  if !isRecording {
                      try? AVAudioSession.sharedInstance().setActive(false, options: [.notifyOthersOnDeactivation])
                  }
              }
          }

          func stopPlayback() {
              player?.stop()
              player = nil
              playingURL = nil
              if !isRecording {
                  try? AVAudioSession.sharedInstance().setActive(false, options: [.notifyOthersOnDeactivation])
              }
          }

          func isPlaying(_ url: URL) -> Bool {
              guard player?.isPlaying == true, let playingURL = playingURL else { return false }
              return playingURL.standardizedFileURL == url.standardizedFileURL
          }

          func audioPlayerDidFinishPlaying(_ player: AVAudioPlayer, successfully flag: Bool) {
              self.player = nil
              playingURL = nil
              if !isRecording {
                  try? AVAudioSession.sharedInstance().setActive(false, options: [.notifyOthersOnDeactivation])
              }
          }
          '''
          assert old in s, 'old stop() block not found'
          s = s.replace(old, new)

          old_delegate = '''    func audioRecorderDidFinishRecording(_ recorder: AVAudioRecorder, successfully flag: Bool) {
              let end = Date()
              let start = currentStart ?? end.addingTimeInterval(-segmentDuration)
              let url = recorder.url

              if flag {
                  onSegmentCompleted?(url, start, end)
                  if transcribeSegments {
                      onSegmentReady?(url, start, end)
                  }
              }

              pruneBuffer()
              refreshStats()

              guard shouldContinue else {
                  isRecording = false
                  return
              }
          '''
          new_delegate = '''    func audioRecorderDidFinishRecording(_ recorder: AVAudioRecorder, successfully flag: Bool) {
              let end = Date()
              let start = currentStart ?? end.addingTimeInterval(-segmentDuration)
              let url = recorder.url

              if self.recorder === recorder {
                  self.recorder = nil
              }
              currentStart = nil

              if flag {
                  onSegmentCompleted?(url, start, end)
                  if transcribeSegments {
                      onSegmentReady?(url, start, end)
                  }
              }

              pruneBuffer()
              refreshStats()

              guard shouldContinue else {
                  isRecording = false
                  statusText = "Остановлено"
                  if player == nil {
                      try? AVAudioSession.sharedInstance().setActive(false, options: [.notifyOthersOnDeactivation])
                  }
                  return
              }
          '''
          assert old_delegate in s, 'recorder delegate block not found'
          s = s.replace(old_delegate, new_delegate)
          p.write_text(s)

          p = root / 'WearMemory/ContentView.swift'
          s = p.read_text()
          needle = '''                        Text(formatBytes(item.sizeBytes))
                              .font(.caption.monospacedDigit())
                              .foregroundColor(.secondary)
                              .frame(minWidth: 52, alignment: .trailing)
          '''
          replacement = '''                        Text(formatBytes(item.sizeBytes))
                              .font(.caption.monospacedDigit())
                              .foregroundColor(.secondary)
                              .frame(minWidth: 52, alignment: .trailing)

                          Button {
                              model.audio.togglePlayback(item.url)
                          } label: {
                              Image(systemName: model.audio.isPlaying(item.url) ? "stop.circle.fill" : "play.circle.fill")
                                  .font(.title2)
                                  .foregroundColor(model.audio.isPlaying(item.url) ? .red : .blue)
                                  .frame(width: 30, height: 30)
                          }
                          .buttonStyle(.plain)
                          .accessibilityLabel(model.audio.isPlaying(item.url) ? "Остановить" : "Воспроизвести")
          '''
          assert needle in s, 'recent audio row block not found'
          s = s.replace(needle, replacement, 1)
          p.write_text(s)

          p = root / 'WearMemory/GoogleDriveSync.swift'
          s = p.read_text()
          old_state = '''        let expectedState = currentState ?? KeychainStore.read(key: pendingStateKey)
              let verifier = currentVerifier ?? KeychainStore.read(key: pendingVerifierKey)
              guard let expectedState = expectedState, !expectedState.isEmpty,
                    items["state"] == expectedState else {
                  clearPendingOAuth()
                  setError("OAuth state не совпадает")
                  return
              }
          '''
          new_state = '''        let expectedState = currentState ?? KeychainStore.read(key: pendingStateKey)
              let verifier = currentVerifier ?? KeychainStore.read(key: pendingVerifierKey)

              // Picker callback may omit state. Validate it strictly whenever Google returns it.
              // PKCE code_verifier remains mandatory for the authorization-code exchange.
              if let returnedState = items["state"], !returnedState.isEmpty {
                  guard let expectedState = expectedState, !expectedState.isEmpty,
                        returnedState == expectedState else {
                      clearPendingOAuth()
                      setError("OAuth state не совпадает")
                      return
                  }
              }
          '''
          assert old_state in s, 'OAuth state block not found'
          s = s.replace(old_state, new_state)
          p.write_text(s)

          p = root / 'WearMemory/Info.plist'
          s = p.read_text()
          s = s.replace('<key>CFBundleShortVersionString</key>\n\t<string>1.5</string>', '<key>CFBundleShortVersionString</key>\n\t<string>1.6</string>')
          s = s.replace('<key>CFBundleVersion</key>\n\t<string>15</string>', '<key>CFBundleVersion</key>\n\t<string>18</string>')
          p.write_text(s)
          PY

          plutil -lint WearMemory/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' WearMemory/Info.plist)" = "1.6"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' WearMemory/Info.plist)" = "18"
          grep -F 'AVAudioPlayerDelegate' WearMemory/AudioBufferManager.swift
          grep -F 'func togglePlayback(_ url: URL)' WearMemory/AudioBufferManager.swift
          grep -F 'model.audio.togglePlayback(item.url)' WearMemory/ContentView.swift
          grep -F 'if let returnedState = items["state"], !returnedState.isEmpty' WearMemory/GoogleDriveSync.swift

          python3 -c "from pathlib import Path; p=Path('project.yml'); s=p.read_text(); old='    info:\\n      path: WearMemory/Info.plist\\n'; marker='        PRODUCT_NAME: WearMemory\\n'; assert old in s; assert marker in s; s=s.replace(old,''); s=s.replace(marker,marker+'        INFOPLIST_FILE: WearMemory/Info.plist\\n',1); p.write_text(s)"

      - name: Build arm64 iOS 15 app
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/WearMemory_v1.6_Source
          brew install xcodegen
          xcodegen generate
          xcodebuild \
            -project WearMemory.xcodeproj \
            -scheme WearMemory \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            TARGETED_DEVICE_FAMILY=1 \
            build | tee /tmp/wm16-build.log

          APP="build/DerivedData/Build/Products/Release-iphoneos/WearMemory.app"
          test -d "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "1.6"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "18"
          /usr/bin/file "$APP/WearMemory" | grep -F 'arm64'
          /usr/bin/codesign --force --sign - "$APP" || true

          rm -rf Payload WearMemory_v1.6_Playback_iOS15.ipa WearMemory_v1.6_Playback_iOS15.ipa.sha256
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry -9 WearMemory_v1.6_Playback_iOS15.ipa Payload -x '*.DS_Store' '*/__MACOSX/*'
          unzip -t WearMemory_v1.6_Playback_iOS15.ipa
          shasum -a 256 WearMemory_v1.6_Playback_iOS15.ipa > WearMemory_v1.6_Playback_iOS15.ipa.sha256
          cp WearMemory_v1.6_Playback_iOS15.ipa /tmp/
          cp WearMemory_v1.6_Playback_iOS15.ipa.sha256 /tmp/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WearMemory-v1.6-Playback-iOS15
          path: |
            /tmp/WearMemory_v1.6_Playback_iOS15.ipa
            /tmp/WearMemory_v1.6_Playback_iOS15.ipa.sha256
          retention-days: 7

      - name: Publish IPA to result branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin wearmemory-v1.6-result
          git checkout -B wearmemory-v1.6-result origin/wearmemory-v1.6-result
          mkdir -p artifacts
          cp /tmp/WearMemory_v1.6_Playback_iOS15.ipa artifacts/
          cp /tmp/WearMemory_v1.6_Playback_iOS15.ipa.sha256 artifacts/
          cp /tmp/wm16-build.log artifacts/build.log
          echo 0 > artifacts/build_status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '4189823+github-actions[bot]@users.noreply.github.com'
          git add artifacts
          git commit -m 'WearMemory v1.6 playback IPA' || true
          git push origin HEAD:wearmemory-v1.6-result
