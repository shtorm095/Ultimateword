name: Build WearMemory Text v1.0.6 IPA

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct v1.0.5 source and install v1.0.6 Speech fix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wmtext106-src
          mkdir -p /tmp/wmtext106-src
          cat wearmemory_text_v100/source.part00 \
              wearmemory_text_v100/source.part01 \
              wearmemory_text_v100/source.part02 \
              wearmemory_text_v100/source.part03 \
              wearmemory_text_v100/source.part04 \
            | base64 --decode > /tmp/WearMemoryText_v1.0.0_Source.zip
          unzip -t /tmp/WearMemoryText_v1.0.0_Source.zip
          ditto -x -k /tmp/WearMemoryText_v1.0.0_Source.zip /tmp/wmtext106-src

          base64 -D -i wearmemory_text_v101/speech-fix.patch.gz.b64 -o /tmp/wmt101.patch.gz
          echo 'b2077cfa763ab2f8e1b4d494ac61755921bdbc81d8c75f91ce1005591a10d6c5  /tmp/wmt101.patch.gz' | shasum -a 256 -c -
          gunzip -c /tmp/wmt101.patch.gz > /tmp/wmt101.patch
          cd /tmp/wmtext106-src
          patch -p4 < /tmp/wmt101.patch
          sed -i '' 's/^    let drive = TextDriveSync()/    var drive = TextDriveSync()/' WearMemoryText/TextAppModel.swift

          base64 -D -i "$GITHUB_WORKSPACE/wearmemory_text_v105/speech-fix-v105.patch.gz.b64" -o /tmp/wmt105.patch.gz
          gunzip -c /tmp/wmt105.patch.gz > /tmp/wmtext105.patch
          echo '863ad1a0d4fcade0faa474fb011a1e6a3a1cbe507754ddccc063f4a5775abc3b  /tmp/wmtext105.patch' | shasum -a 256 -c -
          patch -p0 < /tmp/wmtext105.patch

          cp "$GITHUB_WORKSPACE/wearmemory_text_v106/TextProcessor.swift" WearMemoryText/TextProcessor.swift
          cp "$GITHUB_WORKSPACE/wearmemory_text_v106/TextProcessorJournal.swift" WearMemoryText/TextProcessorJournal.swift
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 1.0.6' WearMemoryText/Info.plist
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 7' WearMemoryText/Info.plist

          SRC=/tmp/wmtext106-src/WearMemoryText
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$SRC/Info.plist" | grep -Fx '1.0.6'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$SRC/Info.plist" | grep -Fx '7'
          grep -q 'SFSpeechAudioBufferRecognitionRequest' "$SRC/TextProcessor.swift"
          grep -q 'SiriSpeechErrorDomain' "$SRC/TextProcessor.swift"
          grep -q 'speechErrorChain' "$SRC/TextProcessor.swift"
          grep -q 'let duration = min(8.0' "$SRC/TextProcessor.swift"
          grep -q 'func journalFiles()' "$SRC/TextProcessorJournal.swift"
          ! grep -q 'SFSpeechURLRecognitionRequest(url:' "$SRC/TextProcessor.swift"
          ! grep -R -q 'AVAudioRecorder' "$SRC"

          cd /tmp/wmtext106-src
          zip -qry /tmp/WearMemoryText_v1.0.6_Source.zip WearMemoryText project.yml
          unzip -t /tmp/WearMemoryText_v1.0.6_Source.zip

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: /tmp/wmtext106-src
        run: xcodegen generate

      - name: Build arm64 iOS 15 app
        working-directory: /tmp/wmtext106-src
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project WearMemoryText.xcodeproj \
            -scheme WearMemoryText \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath /tmp/wmtext106-derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            clean build | tee /tmp/wmtext106-build.log

      - name: Sign and package TrollStore IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="/tmp/wmtext106-derived/Build/Products/Release-iphoneos/WearMemoryText.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist" | grep -Fx 'WearMemory Text'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'local.pavel.WearMemoryText'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -Fx '1.0.6'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" | grep -Fx '7'
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist" | grep -Fx '15.0'
          lipo -archs "$APP/WearMemoryText" | grep -w arm64
          codesign --force --sign - --entitlements /tmp/wmtext106-src/WearMemoryText/WearMemoryText.entitlements "$APP"
          codesign --verify --deep --strict "$APP"
          codesign -d --entitlements :- "$APP" > /tmp/wmtext106-entitlements.plist 2>&1
          grep -q 'group.local.pavel.WearMemory' /tmp/wmtext106-entitlements.plist
          grep -q 'TROLLTROLL.\*' /tmp/wmtext106-entitlements.plist
          grep -q 'com.apple.token' /tmp/wmtext106-entitlements.plist
          rm -rf /tmp/wmtext106-payload
          mkdir -p /tmp/wmtext106-payload/Payload
          ditto "$APP" /tmp/wmtext106-payload/Payload/WearMemoryText.app
          cd /tmp/wmtext106-payload
          zip -qry /tmp/WearMemoryText_v1.0.6b7_iOS15.ipa Payload
          unzip -t /tmp/WearMemoryText_v1.0.6b7_iOS15.ipa
          shasum -a 256 /tmp/WearMemoryText_v1.0.6b7_iOS15.ipa > /tmp/WearMemoryText_v1.0.6b7_iOS15.ipa.sha256

      - name: Upload verified IPA
        uses: actions/upload-artifact@v4
        with:
          name: WearMemoryText-v1.0.6-Ready
          path: |
            /tmp/WearMemoryText_v1.0.6b7_iOS15.ipa
            /tmp/WearMemoryText_v1.0.6b7_iOS15.ipa.sha256
            /tmp/WearMemoryText_v1.0.6_Source.zip
            /tmp/wmtext106-entitlements.plist
            /tmp/wmtext106-build.log
          retention-days: 7
